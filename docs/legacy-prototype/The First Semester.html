<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semester I, unit by unit, in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f0e1;--paper2:#efe7d2;--paper3:#e6dcc3;--ink:#2b2a28;--dim:#6b665b;--hair:rgba(43,42,40,.2);--red:#d4572b;--teal:#2a7f78;--gold:#d49a14;
--hand:Caveat,"Segoe Print","Bradley Hand","Comic Sans MS",cursive;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--rail:272px;--study:410px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#app{display:grid;height:100%;grid-template-columns:var(--rail) minmax(0,1fr) var(--study);grid-template-rows:auto minmax(0,1fr)}
#hd{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:2px solid var(--ink);background:var(--paper)}
#brand{font-family:var(--hand);font-size:30px;line-height:1;font-weight:700;white-space:nowrap}
#brand small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--dim);margin-top:3px;letter-spacing:.02em}
#subs{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:none}
#subs::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:baseline;gap:7px;padding:6px 12px;border:1.5px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;background:transparent;font-size:13px;font-weight:600;transition:background .15s}
.chip:hover{background:var(--paper2)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip i{font-style:normal;font-family:var(--hand);font-size:17px;font-weight:700;color:var(--red)}
.chip.on i{color:var(--gold)}
.chip em{font-style:normal;font-size:11px;font-weight:500;opacity:.7}
#prog{min-width:120px;text-align:right;font-size:11px;color:var(--dim)}
#prog b{display:block;font-family:var(--hand);font-size:22px;color:var(--ink);line-height:1}
#prog .bar{height:4px;background:var(--hair);margin-top:4px;border-radius:4px;overflow:hidden}#prog .bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.btn{padding:7px 14px;border:1.5px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;font-weight:600;font-size:13px;background:var(--paper)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--ink);border-color:var(--ink)}
#units{border-right:2px solid var(--ink);overflow-y:auto;padding:14px 12px 20px;background:var(--paper2)}
#units h2{font-family:var(--hand);font-size:26px;line-height:1.05;margin:0 4px 2px}
#units .meta{font-size:12px;color:var(--dim);margin:0 4px 12px;line-height:1.45}
.un{display:block;width:100%;text-align:left;padding:10px 10px 10px 12px;margin-bottom:6px;border:1.5px solid var(--hair);border-left:5px solid var(--hair);border-radius:4px 12px 12px 4px;background:var(--paper);transition:transform .12s,border-color .12s}
.un:hover{transform:translateX(3px);border-color:var(--ink)}
.un.on{border-color:var(--ink);border-left-color:var(--red);background:#fff9e8;box-shadow:3px 3px 0 var(--ink)}
.un .a{display:flex;gap:8px;align-items:baseline}
.un .a i{font-style:normal;font-family:var(--hand);font-size:20px;font-weight:700;color:var(--red);width:26px}
.un .a b{font-size:13.5px;font-weight:600;line-height:1.25;flex:1}
.un .b{display:flex;justify-content:space-between;margin:4px 0 0 34px;font-size:11px;color:var(--dim)}
.un .bar{height:3px;margin:6px 0 0 34px;background:var(--hair);border-radius:3px;overflow:hidden}.un .bar i{display:block;height:100%;background:var(--teal);width:0}
.un .s3{margin:5px 0 0 34px;font-size:11px;color:var(--teal);font-weight:600}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#cv:active{cursor:grabbing}
#ovt{position:absolute;left:18px;top:14px;pointer-events:none;max-width:46%}
#ovt .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
#ovt h1{font-family:var(--hand);font-size:32px;line-height:.95;font-weight:700;margin-top:2px}
#tools{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.tl{width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);font-weight:700;font-size:15px}
.tl:hover,.tl.on{background:var(--ink);color:var(--paper)}
.tl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hint{position:absolute;right:16px;top:58px;font-family:var(--hand);font-size:18px;color:var(--dim);pointer-events:none;transition:opacity .6s}
#cap{position:absolute;left:14px;right:14px;bottom:14px;max-width:720px;padding:12px 16px 14px;background:rgba(255,251,238,.96);border:2px solid var(--ink);border-radius:6px 18px 6px 18px;box-shadow:4px 4px 0 var(--ink)}
.sn{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sn .sb{width:30px;height:30px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700}
.sn .sb:hover:not(:disabled){background:var(--ink);color:var(--paper)}.sn .sb:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dots button{min-width:26px;height:26px;padding:0 7px;border:1.5px solid var(--hair);border-radius:13px;font-family:var(--hand);font-size:17px;font-weight:700;line-height:1;color:var(--dim)}
.dots button.on{background:var(--red);border-color:var(--red);color:#fff}.dots button.done{border-color:var(--ink);color:var(--ink)}
#cap h3{font-family:var(--hand);font-size:28px;line-height:1.05;font-weight:700}
#cap p{font-size:14px;line-height:1.55;margin-top:5px;color:#3a3833}
#study{border-left:2px solid var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--paper2)}
#tabs{display:flex;border-bottom:2px solid var(--ink)}
#tabs button{flex:1;padding:11px 6px;font-family:var(--hand);font-size:22px;font-weight:700;border-right:1.5px solid var(--hair);color:var(--dim)}
#tabs button:last-child{border-right:0}#tabs button.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 -4px 0 var(--red)}
#tabbody{overflow-y:auto;flex:1;padding:16px 18px 30px;min-height:0}
.box{margin-bottom:16px}
.box>h4{font-family:var(--hand);font-size:23px;font-weight:700;line-height:1;margin-bottom:6px;color:var(--red)}
.note{padding:11px 13px;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px 14px 4px 14px;font-size:14px;line-height:1.6}
.hl{border-left:5px solid var(--gold)}
.stp{display:flex;gap:10px;width:100%;text-align:left;padding:9px 0;border-bottom:1px dashed var(--hair)}
.stp i{flex:none;font-style:normal;font-family:var(--hand);font-size:22px;font-weight:700;color:var(--red);width:22px;line-height:1.1}
.stp b{display:block;font-size:13.5px;margin-bottom:2px}.stp span{font-size:13px;line-height:1.5;color:#3a3833}
.stp.on b{color:var(--red)}
.keys li{list-style:none;font-size:13px;line-height:1.5;padding:5px 0 5px 20px;border-bottom:1px dashed var(--hair);position:relative}
.keys li::before{content:'';position:absolute;left:3px;top:11px;width:8px;height:8px;border:2px solid var(--red);transform:rotate(45deg)}
.we{padding:11px 13px;background:#fff9e8;border:1.5px dashed var(--ink);border-radius:8px;font-size:13.5px;line-height:1.65}
.we b{color:var(--teal)}
.tk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--hair);cursor:pointer;font-size:14px;line-height:1.4}
.tk input{position:absolute;opacity:0}
.tk .bx{flex:none;width:19px;height:19px;border:2px solid var(--ink);border-radius:5px 8px 5px 8px;margin-top:1px;display:grid;place-items:center;background:var(--paper)}
.tk .bx svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3.2;opacity:0}
.tk input:checked+.bx{background:var(--teal);border-color:var(--teal)}.tk input:checked+.bx svg{opacity:1}
.tk input:checked~.tx{color:var(--dim);text-decoration:line-through}
.tk input:focus-visible+.bx{outline:2px solid var(--red);outline-offset:2px}
.tx .st{color:var(--gold);margin-right:4px;font-size:15px}
.ct{font-family:var(--hand);font-size:22px;font-weight:700;margin-bottom:6px}
.xq li{list-style:none;font-size:13.5px;line-height:1.5;padding:5px 0 5px 24px;border-bottom:1px dashed var(--hair);position:relative}
.xq li::before{content:attr(data-m);position:absolute;left:0;top:4px;font-family:var(--hand);font-size:19px;font-weight:700;color:var(--red)}
.xq.trap li::before{color:#b0302a}
.hook{margin-top:14px;padding:12px 14px;border:2px solid var(--red);border-radius:14px 4px 14px 4px;background:#fff1e8;font-family:var(--hand);font-size:23px;line-height:1.2;font-weight:700}
.hook small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--red);margin-bottom:4px}
#modal{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;display:none}
#modal.on{display:block}
.mw{max-width:960px;margin:0 auto;padding:22px 24px 80px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
.mh h2{font-family:var(--hand);font-size:44px;line-height:1;font-weight:700}
.ms{padding:22px 0;border-bottom:1.5px dashed var(--ink)}
.ms h3{font-family:var(--hand);font-size:30px;font-weight:700;margin-bottom:8px}.ms h3 span{color:var(--red);margin-right:8px}
.ms p.l{font-size:14px;color:var(--dim);line-height:1.55;margin-bottom:12px;max-width:640px}
.ttab{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;min-width:620px}
.ttab th{font-size:11px;font-weight:700;color:var(--dim);padding:4px}
.ttab td{height:50px;padding:6px 8px;font-size:12.5px;font-weight:600;line-height:1.2;vertical-align:top;background:color-mix(in srgb,var(--c) 22%,var(--paper));border-left:4px solid var(--c);border-radius:3px}
.ttab td.f{background:var(--paper2);color:var(--dim);font-weight:500}.ttab td.o{opacity:.3}.ttab td.brk{background:none;border:0;text-align:center;vertical-align:middle;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.1em}
.ttab small{display:block;font-weight:500;color:var(--dim);margin-top:2px;font-size:10.5px}
.sx{overflow-x:auto}
.seg{display:inline-flex;margin-left:8px}.seg button{padding:4px 12px;border:1.5px solid var(--ink);margin-left:-1.5px;font-weight:700;font-size:12px}.seg button.on{background:var(--ink);color:var(--paper)}
.wk{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--hair)}
.wk.now{background:#fff1d0;outline:2px solid var(--gold);padding:12px 10px}
.wk b{font-family:var(--hand);font-size:26px;line-height:1;color:var(--red)}.wk small{display:block;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.wk li{list-style:none;font-size:13.5px;line-height:1.5;padding:2px 0 2px 16px;position:relative}.wk li::before{content:'';position:absolute;left:0;top:10px;width:7px;height:2px;background:var(--red)}
.xd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.xd input{padding:6px 8px;border:1.5px solid var(--ink);background:var(--paper);font:inherit;border-radius:6px}
.fm{columns:2;column-gap:30px}.fm .g{break-inside:avoid;margin-bottom:14px}.fm h4{font-size:14px;margin-bottom:3px}.fm li{list-style:none;font-size:13px;line-height:1.45;padding:2px 0 2px 14px;position:relative}.fm li::before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;border:2px solid var(--red);transform:rotate(45deg)}
.rl{counter-reset:r;list-style:none}.rl li{counter-increment:r;display:grid;grid-template-columns:34px 1fr;padding:8px 0;border-bottom:1px dashed var(--hair);font-size:14px;line-height:1.5}.rl li::before{content:counter(r);font-family:var(--hand);font-size:24px;font-weight:700;color:var(--red);line-height:1}
.hk{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-bottom:1px dashed var(--hair)}.hk b{font-size:14px}.hk span{font-family:var(--hand);font-size:21px;line-height:1.2;font-weight:700}
#menu{display:none}

#nmodal{position:fixed;inset:0;z-index:31;background:var(--paper);overflow-y:auto;display:none}#nmodal.on{display:block}
.nsel{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0}
.nsub{padding:26px 0;border-top:2.5px solid var(--ink)}
.nsub h4{font-family:var(--hand);font-size:38px;line-height:1;font-weight:700}.nsub h4 span{color:var(--red);margin-right:8px}
.nm{font-size:12.5px;color:var(--dim);margin:6px 0 8px}.why{font-size:14px;line-height:1.6;padding:9px 12px;border-left:5px solid var(--gold);background:var(--paper2);margin-bottom:6px}
.nun{padding:16px 0;border-bottom:1.5px dashed var(--hair);break-inside:avoid-page}
.nun h5,.unotes h5{font-family:var(--hand);font-size:27px;font-weight:700;line-height:1.05;margin-bottom:4px}.nun h5 small,.unotes h5 small{font-family:var(--body);font-size:11px;color:var(--dim);font-weight:600;margin-left:8px}
.nl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:11px 0 3px}
.nun p,.unotes p{font-size:13.5px;line-height:1.6}
.nt{padding-left:0}.nt li{list-style:none;font-size:13px;line-height:1.5;padding:2px 0 2px 18px;position:relative}.nt li::before{content:'•';position:absolute;left:4px;color:var(--ink)}.nt li.s::before{content:'★';color:var(--gold);left:1px}.nt.k li::before{content:'';width:7px;height:7px;border:2px solid var(--red);transform:rotate(45deg);top:7px;left:3px}
.nst{padding-left:20px}.nst li{font-size:13px;line-height:1.55;padding:2px 0}
.nex{margin-top:14px;padding:10px 14px;border:1.5px solid var(--ink);border-radius:4px 14px 4px 14px;background:#fffaf0}
.unotes .nl:first-of-type{margin-top:6px}
@media print{html,body{height:auto!important;overflow:visible!important;background:#fff}#app,#modal,#hd,.noprint{display:none!important}#nmodal{position:static!important;display:block!important;overflow:visible!important;background:#fff}.mw{max-width:none;padding:0}.nsub{break-before:page}.nsub:first-of-type{break-before:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (max-width:900px){
 html,body{height:auto}body{overflow-x:hidden}
 #app{display:block;height:auto}
 #hd{position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:8px;padding:8px 12px}
 #brand{font-size:24px}#brand small{display:none}#prog{margin-left:auto}#hd .btn{padding:6px 10px}
 #subs{order:5;flex-basis:100%}
 #units{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:2px solid var(--ink)}#units h2,#units .meta{display:none}
 .un{flex:none;width:210px;margin:0}
 #stage{height:56vh;min-height:360px}
 #ovt h1{font-size:26px}#ovt{max-width:58%}
 #cap{position:static;max-width:none;margin:0;border-radius:0;border-width:2px 0 2px;box-shadow:none}
 #stage{overflow:visible;height:auto}#cv{position:relative;height:50vh;min-height:320px}
 #ovt{top:10px;left:12px}#tools{top:10px;right:10px}#hint{top:52px;right:12px}
 #study{border-left:0;border-top:2px solid var(--ink)}#tabbody{overflow:visible}
 .fm{columns:1}.wk{grid-template-columns:1fr}.hk{grid-template-columns:1fr}.mh h2{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
 <header id="hd"><div id="brand">Semester I, unit by unit<small>Mathematics &amp; Computing · LNJPIT Chapra · Group A</small></div><nav id="subs" aria-label="Subjects"></nav><div id="prog"><b id="pn">0/0</b>topics cleared<div class="bar"><i id="pb"></i></div></div><button class="btn" id="notesb">All notes</button><button class="btn red" id="planb">Exam plan</button></header>
 <aside id="units" aria-label="Units"></aside>
 <section id="stage"><canvas id="cv" aria-label="Interactive 3D diagram"></canvas><div id="ovt"></div>
  <div id="tools">
   <button class="tl" id="t-spin" aria-label="Spin" title="Spin"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
   <button class="tl" id="t-play" aria-label="Pause animation" title="Pause or play motion"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
   <button class="tl" id="t-in" aria-label="Zoom in">+</button><button class="tl" id="t-out" aria-label="Zoom out">−</button>
   <button class="tl" id="t-reset" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
  </div><div id="hint">drag to turn it, scroll to zoom</div>
  <div id="cap"></div></section>
 <aside id="study" aria-label="Study this unit"><div id="tabs" role="tablist"></div><div id="tabbody"></div></aside>
</div>
<div id="nmodal" role="dialog" aria-modal="true" aria-label="All notes"><div class="mw" id="nw"></div></div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Exam plan"><div class="mw" id="mw"></div></div>
<script>
/* ---------- helpers: hand-drawn notebook SVG ---------- */
const S=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${b}</svg>`;
const L=(a,b,c,d,k='l')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" class="${k}"/>`;
const escT=s=>String(s).replace(/&(?!(lt|gt|amp);)/g,'&amp;').replace(/</g,'&lt;');
const T=(x,y,s,k='t',an='start')=>`<text x="${x}" y="${y}" class="${k}" text-anchor="${an}">${escT(s)}</text>`;
const P=(d,k='l',m='')=>`<path d="${d}" class="${k}" ${m}/>`;
const C=(x,y,r,k='l')=>`<circle cx="${x}" cy="${y}" r="${r}" class="${k}"/>`;
const R=(x,y,w,h,k='l')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${k}"/>`;
const AR='marker-end="url(#ar)"';
window.SUBJECTS=[];
const LA=(a,b,c,d,k="a")=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" class="${k}" marker-end="url(#ar)"/>`;
SUBJECTS.push({
id:'math',code:'100102',name:'Engineering Mathematics-I',co:'Math-I',sub:'42 h theory · 3-0-0 · plus Sat remedial',fac:'Dr. G.N. Tripathi',cr:3,
tag:'Highest effort, highest return. Earn it every single day.',
why:'Math-I is the only subject on your timetable with a remedial slot, and that is the department telling you where students lose marks. Every question is a method you can drill: same steps, new numbers. Skip two weeks and you cannot catch up the night before; practise 45 minutes daily and it becomes the most predictable paper you sit.',
eff:5,ret:4,tint:'#3b3a35',bg:'#1b1a17',call:'Daily practice buys rank',
units:[
{t:'Basic Linear Algebra',h:'8h',topics:[
'★ Elementary transformations; rank by Echelon form','★ Rank by Normal form','Linear dependence and independence of vectors in Rⁿ','★ Consistency of a system of linear equations','★ Eigenvalues and eigenvectors','★ Cayley–Hamilton theorem','Similarity of matrices and diagonalization','★ Quadratic form and canonical form'],
s:'Rank means how many rows are truly independent. If one row is just a copy of two others added up, it adds nothing, so it does not count. Row operations are like tidying a messy desk without throwing anything away: the answer stays the same, the picture gets clearer. An eigenvector is a direction that a matrix only stretches and never turns; the stretch factor is the eigenvalue.',
k:['Rank = number of non-zero rows left in echelon form','Consistent ⇔ r(A) = r([A|B]); unique if r = n, infinite if r < n, none if ranks differ','Characteristic equation: |A − λI| = 0','Sum of eigenvalues = trace; product = determinant','Cayley–Hamilton: A satisfies its own characteristic equation; multiply by A⁻¹ to get the inverse','Diagonalize: P⁻¹AP = D, columns of P are eigenvectors']},
{t:'Differential Calculus: Single Variable',h:'8h',topics:[
'Higher order derivatives and successive differentiation','★ Leibnitz’s theorem','★ Rolle’s theorem','★ Lagrange’s mean value theorem','Cauchy’s mean value theorem','★ Indeterminate forms; L’Hôpital rule','Tangents and normals of algebraic and polar curves','★ Curvature'],
s:'Mean value theorems say: if you drove from A to B smoothly, at some moment your speed equalled your average speed. Rolle is the special case where you came back to the start, so at some moment you were standing still. L’Hôpital is for fractions that look like 0/0: differentiate top and bottom separately and try again. Curvature tells you how sharply a road bends; a tight bend has a small circle that fits it.',
k:['Leibnitz: (uv)ₙ = Σ ⁿCᵣ uₙ₋ᵣ vᵣ','Rolle: f continuous on [a,b], differentiable on (a,b), f(a)=f(b) ⇒ f′(c)=0','Lagrange: f′(c) = [f(b) − f(a)]/(b − a)','L’Hôpital works only for 0/0 or ∞/∞; other forms must be converted first','Curvature κ = y₂ / (1 + y₁²)^(3/2); radius ρ = 1/κ','Polar: tan φ = r·dθ/dr']},
{t:'Differential Calculus: Several Variables',h:'9h',topics:[
'Partial differentiation','★ Euler’s theorem on homogeneous functions','Limit, continuity and differentiability of functions of several variables','★ Taylor’s theorem with various forms of remainder','Maclaurin’s theorem and related problems','★ Maxima and minima of several variables','★ Lagrange’s multiplier method'],
s:'A partial derivative asks how the answer changes when you nudge one input and freeze the rest, like turning only the bass knob. A homogeneous function scales cleanly: double every input and the output multiplies by 2ⁿ, and Euler’s theorem turns that into a formula. For maxima and minima, find where the surface is flat, then check its curvature to see whether you are on a hilltop, in a valley or on a saddle. Lagrange multipliers find the highest point of a hill while forced to walk along a fixed path.',
k:['Euler: x·fₓ + y·f_y = n·f','Second order: x²fₓₓ + 2xy·fₓᵧ + y²f_yy = n(n−1)f','Stationary: fₓ = 0 and f_y = 0; let r = fₓₓ, s = fₓᵧ, t = f_yy','rt − s² > 0 and r < 0 → maximum; rt − s² > 0 and r > 0 → minimum','rt − s² < 0 → saddle; rt − s² = 0 → test fails','Lagrange: build F = f + λφ, set Fₓ = F_y = F_z = 0 and φ = 0']},
{t:'Integral Calculus',h:'9h',topics:[
'★ Differentiation under the integral sign (Leibnitz’s rule)','★ Double integral','★ Change of order of integration','Double integral in polar co-ordinates','Triple integral','Triple integral in spherical and cylindrical polar co-ordinates','★ Beta function','★ Gamma function','Elliptic integral','Relation between Beta and Gamma functions; general properties'],
s:'A double integral adds up tiny boxes over a flat region, and a triple integral does it for a solid. Changing the order of integration is just slicing the same region the other way: draw the region first and read off the new limits from the picture. Polar, cylindrical and spherical coordinates are the right ruler when the shape is round. Beta and Gamma turn awkward integrals into a factorial-like lookup.',
k:['Leibnitz rule: d/dx ∫ₐ₍ₓ₎^b₍ₓ₎ f(x,t)dt = ∫ ∂f/∂x dt + f(x,b)·b′ − f(x,a)·a′','Polar: dx dy = r dr dθ','Cylindrical: dV = r dr dθ dz','Spherical: dV = r² sinθ dr dθ dφ','Γ(n+1) = nΓ(n); Γ(½) = √π; Γ(n+1) = n! for integer n','B(m,n) = Γ(m)Γ(n)/Γ(m+n) = 2∫₀^(π/2) sin^(2m−1)θ cos^(2n−1)θ dθ']},
{t:'Vector Calculus',h:'8h',topics:[
'★ Scalar and vector fields; gradient','★ Divergence and curl with physical meaning','Tangent plane; directional derivative','Line, surface and volume integrals','★ Green’s theorem: verification and evaluation','★ Stokes’ theorem: verification and evaluation','★ Gauss divergence theorem: verification and evaluation'],
s:'Gradient points uphill, as steep as it gets, and is always at right angles to the contour line. Divergence asks whether a field is a tap (spreading out) or a drain (sucking in) at a point. Curl asks whether a tiny paddle wheel placed there would spin. The three big theorems say the same thing in different clothes: what happens along the boundary equals what happens inside.',
k:['∇φ is normal to the surface φ = c; directional derivative = ∇φ · û','∇·(∇×F) = 0 and ∇×(∇φ) = 0','Green: ∮(P dx + Q dy) = ∬(∂Q/∂x − ∂P/∂y) dA','Stokes: ∮F·dr = ∬(∇×F)·n̂ dS','Gauss: ∯F·n̂ dS = ∭∇·F dV','To verify a theorem, compute both sides separately and show they match']}

id:'phy',code:'100104',name:'Engineering Physics',co:'Physics',sub:'42 h theory · 3-0-2 · lab on Friday',fac:'Dr. Niharika Kulshrestha',cr:4,
tag:'Four credits and five derivation-heavy units. Learn the derivations as drawings.',
why:'Physics carries 4 credits (3 theory plus 1 lab), the joint-largest weight on your timetable. Its TSOs say “derive”, “find the wavelength”, “calculate energy levels”, so the paper rewards the same dozen derivations and formulas every year. Learn each one as a picture plus three lines of algebra, and use the Friday lab to lock in the numerical side.',

{t:'Wave Optics',h:'8h',topics:[
'★ Interference by division of amplitude','★ Newton’s rings experiment','★ Michelson interferometer','Fraunhofer diffraction: single and double slit','Fraunhofer diffraction: circular aperture','★ Diffraction grating','★ Rayleigh criterion and resolving power of a telescope','Polarization and double-refracting crystal','Nicol prism'],
s:'Interference is two waves meeting: crest on crest makes bright, crest on trough makes dark. Newton’s rings are what you get when a curved lens sits on flat glass, so the air gap grows steadily outward and bright and dark circles appear. A diffraction grating is thousands of narrow slits that sharpen the pattern so you can measure wavelength. The Rayleigh criterion says two stars are just separable when the peak of one falls on the first dark ring of the other.',
k:['Newton’s rings (dark, reflected): Dₙ² = 4nλR','λ = (D²ₙ₊ₚ − D²ₙ) / (4pR)','Single slit minima: a sinθ = mλ','Grating: (a + b) sinθ = nλ; highest visible order n < (a + b)/λ','Rayleigh, circular aperture: sinθ ≈ 1.22 λ/D','Michelson: 2d = Nλ, so λ = 2Δd/N for N fringe shifts']},
{t:'Lasers and Optical Fiber',h:'8h',topics:[
'Characteristics of laser light','★ Einstein’s A and B coefficients','Population inversion and pumping mechanism','Optical resonator','★ Ruby laser','★ He–Ne laser','Semiconductor laser','★ Structure of optical fibre; TIR, acceptance angle and numerical aperture','Types of optical fibre','Propagation mechanism and attenuation in fibre','Applications of optical fibres and fibre optic sensors'],
s:'A normal bulb sends out waves of every colour and every timing, like a crowd talking. A laser is a crowd chanting one word in perfect time. To get that, you need more atoms waiting in the high energy level than the low one (population inversion), so that one passing photon triggers a chain of identical copies. A fibre keeps light inside by total internal reflection, like a mirror-lined pipe, and only light entering within the acceptance cone gets trapped.',
k:['Three processes: absorption, spontaneous emission (A₂₁), stimulated emission (B₂₁)','Equilibrium result: B₁₂ = B₂₁ and A₂₁/B₂₁ = 8πhν³/c³','Spontaneous : stimulated = e^(hν/kT) − 1','Critical angle: sin θc = n₂/n₁','NA = √(n₁² − n₂²) = sin θ₀ (launch from air)','Attenuation α = (10/L) log₁₀(Pin/Pout) dB/km']},
{t:'Electromagnetism and Propagation of Waves',h:'8h',topics:[
'Electric fields and Gauss’ law','★ Dielectrics and capacitors; Gauss’ law in dielectric media','Magnetic fields','★ Magnetic materials: dia, para and ferromagnetic','★ Maxwell’s equations in integral form','Electromagnetic waves','★ Poynting theorem and Poynting vector'],
s:'A dielectric is an insulator whose atoms stretch into tiny dipoles inside an electric field. Those dipoles push back against the field, so the field inside becomes weaker and a capacitor can hold more charge. Magnetic materials differ by how their atoms respond: diamagnets push the field out weakly, paramagnets pull it in weakly, ferromagnets pull it in strongly and stay magnetised. Maxwell’s four equations are the whole story of electricity and magnetism, and together they predict light as a travelling wave.',
k:['Gauss in dielectric: ∮D·dA = q_free, with D = ε₀E + P = εE','C = K·C₀ (K is the dielectric constant)','Maxwell (integral): ∮E·dA = q/ε₀; ∮B·dA = 0; ∮E·dl = −dΦB/dt; ∮B·dl = μ₀(I + ε₀ dΦE/dt)','Wave speed c = 1/√(μ₀ε₀); E = cB','Poynting vector S = E × H, direction of energy flow','Average |S| = ½ ε₀ c E₀² in free space']},
{t:'Quantum Mechanics',h:'8h',topics:[
'Need for quantum mechanics','★ De Broglie hypothesis','★ Heisenberg uncertainty principle','Wave function and its characteristics','★ Schrödinger’s equation: time-dependent and time-independent','★ Particle in a box: energy eigenvalues and eigenfunctions','★ Potential barrier and tunnelling'],
s:'Small things like electrons behave like waves, so each one gets a wavelength set by its momentum. You cannot know both exactly where something is and exactly how fast it moves; this is not a flaw in the instrument but a property of waves. A particle trapped in a box can only hold wavelengths that fit, like a guitar string pinned at both ends, so its energy comes in steps. Tunnelling means the wave leaks a little way through a wall, so there is a small chance the particle appears on the other side.',
k:['λ = h/p = h/√(2mE); electron through V volts: λ ≈ 12.27/√V Å','Δx · Δp ≥ ħ/2','Wave function must be single-valued, finite, continuous and normalisable: ∫|ψ|²dx = 1','Box of width L: Eₙ = n²h²/(8mL²), ψₙ = √(2/L) sin(nπx/L)','Zero-point energy: n = 1, never zero','Tunnelling: T ≈ e^(−2κa) with κ = √(2m(V₀ − E))/ħ']},
{t:'Semiconductors and Nano-materials',h:'10h',topics:[
'Types of materials: metal, semiconductor and insulator','Intrinsic and extrinsic semiconductors; p-type and n-type','★ Diffusion, drift and Fermi level','Photodiode','P-N junction transistor','LED','★ Hall effect','★ Solar cell and its characteristics','Introduction to nanoscience and nanotechnology; significance of the nanoscale','Unique properties: bulk versus nanomaterials, surface-to-volume ratio, band gap change','Classification of nanostructured materials: 0D (quantum dot), 1D (nanowire)'],
s:'Metals have no gap between filled and empty energy levels, insulators have a wide gap, and semiconductors sit in between so a little heat or doping lets some electrons cross. Drift is carriers pushed by a field; diffusion is carriers spreading from crowded to empty regions, like perfume in a room. The Hall effect uses a sideways voltage to reveal whether the carriers are positive or negative and how many there are. At the nanoscale most atoms sit on the surface and electrons are squeezed, so the same material changes colour and conductivity.',
k:['Drift current density J = nqμE = σE','Diffusion: J = qD(dn/dx); Einstein relation D/μ = kT/q','Hall: V_H = BI/(nqt); R_H = 1/(nq); negative sign means electrons','Solar cell: FF = Pmax/(I_sc × V_oc); efficiency = Pmax/Pin','Intrinsic Fermi level lies near mid-gap; n-type moves up, p-type moves down','Surface-to-volume ratio rises as size falls']},

s:'Kirchhoff’s current law says what flows into a junction must flow out, like water at a pipe joint. His voltage law says that if you walk once around any loop, the rises and drops add to zero. Mesh analysis writes the voltage law for each loop; nodal analysis writes the current law for each junction. Pick whichever gives fewer equations.',

s:'RMS is the “DC-equivalent” of an AC wave: the steady voltage that would heat a heater equally. A phasor is just an arrow whose length is the size of the wave and whose angle is how far ahead or behind it is. In a coil, current lags voltage; in a capacitor, current leads. Power factor tells you how much of the current is doing useful work, and a low value means wasted current in the wires.',

s:'A transformer has two coils wound on one iron core. Change the current in one coil, and the changing magnetic field induces a voltage in the other, but only with alternating current. More turns on a coil means more voltage on it. A DC motor works because a wire carrying current inside a magnetic field feels a push; the commutator keeps flipping the current so the push stays in the same direction.',

s:'A diode is a one-way valve for current. Forward bias opens the valve after about 0.7 V for silicon; reverse bias keeps it shut until breakdown. A rectifier uses that valve to chop the negative half of an AC wave, and a capacitor filter fills in the gaps. A Zener diode is built to survive reverse breakdown and holds its voltage steady there. A BJT is a tap controlled by a small base current: a little base current lets a large collector current flow.',
k:['Silicon cut-in ≈ 0.7 V, germanium ≈ 0.3 V','Half-wave: V_dc = Vm/π, V_rms = Vm/2, ripple factor 1.21, efficiency 40.6%, PIV = Vm','Full-wave: V_dc = 2Vm/π, V_rms = Vm/√2, ripple factor 0.48, efficiency 81.2%','I_E = I_B + I_C; β = I_C/I_B; α = I_C/I_E; β = α/(1 − α)','Switch: cut-off = OFF, saturation = ON; amplifier works in the active region','Zener regulator: series resistor takes the excess voltage']},

id:'ai',code:'100105',name:'Introduction to AI',co:'AI',sub:'42 h theory · 3-0-0',fac:'Mr. Nauman Jawaid',cr:3,
tag:'Concept-heavy, trace-heavy, no heavy maths. Score by tracing algorithms on paper.',
why:'Its course outcomes begin with “explain”, “trace” and “perform manual inference”, which means the paper asks you to run algorithms by hand on small examples. Search (BFS, DFS, A*, alpha-beta) and logic (resolution, chaining) are the predictable heavy hitters. The rest is definitions you can recite in the same structure each time.',
eff:3,ret:4,tint:'#363936',bg:'#161a16',call:'Trace it by hand',
units:[
{t:'Introduction to Artificial Intelligence',h:'8h',topics:[
'What is AI; history and evolution','Foundations: philosophy, mathematics, cognitive science','★ Intelligent agents: agent–environment interaction and PEAS','★ Types of environments','★ Types of agents: simple reflex, model-based, goal-based, utility-based, learning','Overview of AI application domains across engineering disciplines'],
s:'An agent is anything that senses its surroundings and acts on them, like a thermostat or a self-driving car. PEAS is a checklist for describing one: how it is judged (Performance), where it works (Environment), what it can do (Actuators), what it can sense (Sensors). Environments are classified by questions like “can it see everything?” and “does the world change while it thinks?”. The five agent types are a ladder: from “if this then that” up to “learns from experience”.',
k:['PEAS = Performance measure, Environment, Actuators, Sensors','Environment axes: observable / partly, deterministic / stochastic, episodic / sequential, static / dynamic, discrete / continuous, single / multi-agent','Agent ladder: simple reflex → model-based → goal-based → utility-based → learning','Reflex agent has no memory; model-based keeps internal state','Utility-based picks the best action when goals alone are not enough']},
{t:'Problem Solving by Search',h:'9h',topics:[
'★ Problem formulation and state-space representation','★ Uninformed search: BFS and DFS','Uniform cost, depth-limited and iterative deepening search','★ Greedy best-first search','★ A* algorithm','★ Heuristic design: admissibility and consistency','Local search: hill climbing','Simulated annealing (concept)','★ Adversarial search: minimax','★ Alpha-beta pruning','Constraint satisfaction problems: concept and backtracking (overview)'],
s:'Search means exploring a tree of choices. BFS explores level by level, like ripples in a pond, so it always finds the shortest path in steps. DFS dives down one branch first, like exploring a maze with one hand on the wall. A* is smart BFS: it scores each option as “cost so far” plus “my optimistic guess to the goal” and always expands the lowest score. In two-player games, minimax assumes the opponent plays perfectly, and alpha-beta skips branches that cannot change the final decision.',
k:['A*: f(n) = g(n) + h(n)','Admissible: h(n) ≤ true cost h*(n); consistent: h(n) ≤ c(n, n′) + h(n′)','BFS: complete, optimal for equal step cost, O(bᵈ) time and space','DFS: O(bm) space, not guaranteed to find shortest path','Iterative deepening = DFS memory with BFS completeness','Alpha-beta: prune when α ≥ β; best case examines about b^(m/2) nodes']},
{t:'Knowledge Representation and Reasoning',h:'8h',topics:[
'Knowledge representation issues; propositional logic syntax and semantics','★ Inference in propositional logic: resolution','First-order predicate logic: syntax and quantifiers','★ Forward chaining','★ Backward chaining','Resolution in first-order logic (concept)','Semantic networks and frames','Rule-based (production) systems'],
s:'Logic lets a machine be certain. To prove a claim by resolution you assume the claim is false, add it to what you know, and keep combining clauses until you reach an obvious contradiction, the empty clause. Forward chaining starts from known facts and fires rules until the goal appears; backward chaining starts from the goal and asks “what would I need to prove first?”. A semantic network is a map of things and the links between them.',
k:['Modus ponens: from P and P → Q, conclude Q','Resolution: (A ∨ B) and (¬A ∨ C) give (B ∨ C)','To prove α: add ¬α to the KB, derive the empty clause','Forward chaining is data-driven; backward chaining is goal-driven','∀ usually pairs with →; ∃ usually pairs with ∧','Convert to CNF before resolving']},
{t:'Reasoning Under Uncertainty',h:'7h',topics:[
'Sources of uncertainty; review of probability theory','★ Bayes’ theorem and its application','★ Bayesian networks: representation and manual inference','Introduction to fuzzy logic and fuzzy sets','Certainty factors and rule-based uncertainty (overview)'],
s:'Bayes’ theorem updates a belief when new evidence arrives, like revising “it will rain” after you see dark clouds. A Bayesian network draws which things cause which, and each node stores how likely it is given its parents. Fuzzy logic replaces “hot or not hot” with a dial from 0 to 1, because real concepts like “warm” have soft edges.',
k:['P(A|B) = P(B|A)·P(A)/P(B)','P(B) = Σ P(B|Aᵢ)·P(Aᵢ)','Bayes net joint: P(x₁…xₙ) = Π P(xᵢ | parents(xᵢ))','Fuzzy: union = max, intersection = min, complement = 1 − μ','Membership value lies between 0 and 1']},
{t:'Introduction to Machine Learning and AI Applications',h:'10h',topics:[
'★ Machine learning paradigms: supervised, unsupervised, reinforcement','Regression and classification: linear regression, k-NN, decision trees','★ Clustering: k-means','★ Artificial neural networks: perceptron and basic architecture','Natural language processing','Computer vision','Expert systems: architecture and applications','Robotics and AI','Ethics, bias and responsible AI; societal impact; SDGs'],
s:'Supervised learning is studying with an answer key; unsupervised is sorting a pile of photos with no labels; reinforcement is learning a game by getting rewards and penalties. A perceptron is the simplest artificial neuron: multiply each input by a weight, add them up, and fire if the sum crosses a threshold. k-means groups points by repeatedly assigning each to the nearest centre and then moving the centre to the middle of its group. Bias in AI enters mostly through the data it was trained on.',
k:['Perceptron: y = step(Σ wᵢxᵢ + b); update w ← w + η(t − y)x','k-means: pick k centres → assign → recompute centres → repeat until stable','k-NN: majority vote among the k nearest points','Linear regression: choose the line that minimises squared error','Decision tree: split on the feature that best separates classes','Expert system = knowledge base + inference engine + user interface']}
],

why:'CFET is the cheapest 3 credits on your timetable. Unit 2 is fixed-method arithmetic (conversions, complements) that you can finish perfectly in an afternoon of practice, and the other units are definitions plus labelled diagrams. For a Mathematics & Computing student most of it will feel familiar, so protect your time for Math and Physics and let CFET pay for it.',

'Classification of computers; functional units','★ CPU organisation and working','★ Memory architecture and hierarchy','★ CPU registers; impact of cache memory on performance','Motherboard and its components','★ Von Neumann architecture','Machine language, assembly language and high-level languages','★ Compiler versus interpreter'],
s:'A computer is a loop: fetch an instruction from memory, decode it, execute it, repeat. The CPU does the thinking, memory holds the work, and input/output connects to the world. Memory comes in layers, like a desk (registers), a bookshelf (cache), a library (RAM) and a warehouse (disk): the closer it is the faster it is, but the less of it you have. A compiler translates the whole book before you read; an interpreter translates one line at a time as you read.',
k:['Von Neumann: one memory holds both program and data; CPU = ALU + control unit + registers','Cycle: fetch → decode → execute','Hierarchy: registers → cache → RAM → secondary storage; faster means smaller and costlier','Cache cuts the average access time by serving repeated data quickly','Compiler: whole program, reports all errors after; interpreter: line by line, stops at first error']},
{t:'Data Representation',h:'8h',topics:[
'Data representation and number systems','★ Conversion between decimal and binary','★ Conversion among binary, octal and hexadecimal','★ Binary arithmetic: addition and subtraction','★ Signed numbers: 1’s complement','★ Signed numbers: 2’s complement','★ ASCII and Unicode','Data representation in memory'],
s:'Computers only have two digits, so everything becomes bits. To convert a decimal number to binary, keep dividing by 2 and read the remainders from the bottom up. Octal and hex are shortcuts: group the bits in threes for octal and in fours for hex. For negative numbers, 2’s complement means “flip every bit, then add 1”, and it lets the same adder do subtraction. A character is just a number that both sides agree to read as a letter, which is what ASCII and Unicode are.',
k:['Decimal → binary: divide by 2, read remainders upward; fractions: multiply by 2, read integers downward','Binary → hex: groups of 4 bits; binary → octal: groups of 3 bits','1’s complement: flip all bits; has two zeros','2’s complement: flip all bits, add 1; n-bit range −2ⁿ⁻¹ to 2ⁿ⁻¹ − 1','Subtraction: A − B = A + (2’s complement of B), discard the carry out','ASCII: 7-bit, 128 characters; ‘A’ = 65 = 01000001, ‘a’ = 97; Unicode covers all scripts']},
{t:'Computer Software and Operating Systems',h:'9h',topics:[
'Introduction to software; types of software','System software','Application software','★ Operating system and its objectives','★ Types of OS: batch, time-sharing, distributed, real-time','★ Functions of OS: process management and memory management','CLI versus GUI','File system basics: Windows, Linux, macOS'],
s:'Software is the set of instructions; hardware obeys them. System software runs the machine (OS, compilers); application software does your jobs (browser, spreadsheet). The operating system is the manager in the middle: it shares the CPU between programs, hands out memory, and keeps your files organised. Batch runs jobs in bundles, time-sharing slices the CPU quickly so many users feel served at once, distributed spreads work over many computers, and real-time guarantees an answer within a deadline.',
k:['OS objectives: convenience, efficient use of hardware, ability to evolve','Process = a program in execution; states: new → ready → running → waiting → terminated','Memory management: allocate, track and free memory for processes','Batch: no interaction; time-sharing: quick slices; real-time: hard deadlines (airbags, medical)','CLI: type commands, fast and scriptable; GUI: icons and windows, easier to learn']},
{t:'Computer Networks and Internet Basics',h:'9h',topics:[
'Introduction to computer networks; importance of networking','Data transmission media and transmission across media','Data transmission in a network','★ Network types: LAN, WAN, MAN','★ Network topologies: star, bus, ring, mesh','Communication protocol','★ Network devices: hub, switch, router, modem, gateway','Wireless networking','★ Internet and IP address','TCP, UDP, HTTP, FTP, DNS, URL','Client–server architecture'],
s:'A network is computers connected so they can share things. A hub shouts every message to everyone, a switch whispers it only to the right device, and a router decides which network a message should go to next. An IP address is the postal address of a device; DNS is the phone book that turns a name like a website into that address. TCP is registered post (reliable, in order) and UDP is a postcard (fast, no guarantee).',
k:['LAN: building; MAN: city; WAN: country or world','Mesh with n nodes needs n(n−1)/2 links; star fails if the hub fails; bus fails if the cable breaks','Hub: broadcast; switch: forwards by MAC address; router: forwards by IP address; modem: modulates and demodulates; gateway: connects different protocols','IPv4: 32 bits as four numbers 0–255','TCP: reliable, connection-oriented; UDP: fast, connectionless','DNS: name → IP; URL = protocol + domain + path']},
{t:'Emerging Technologies',h:'8h',topics:[
'★ Internet of Things: concept, architecture and applications','★ Cyber security: terminologies and CIA triad','Types of cyber threats and countermeasures','Artificial Intelligence: introduction, agents and applications','Machine learning: learning paradigms and applications','★ Blockchain: distributed ledger, blocks, hashing and decentralisation','Data science: lifecycle and role of data in decision making'],
s:'IoT is everyday objects with sensors and internet access, like a smart bulb reporting to your phone. The CIA triad is the three goals of security: keep secrets secret (Confidentiality), keep data unaltered (Integrity), keep it reachable (Availability). A blockchain is a notebook shared by many people where each page carries the fingerprint (hash) of the page before it, so changing an old page breaks every page after it.',
k:['IoT layers: sensing → network → data processing → application','CIA triad: Confidentiality, Integrity, Availability','Block = data + hash + previous block’s hash','Decentralisation: no single owner; many copies of the ledger','Data science lifecycle: collect → clean → analyse → model → communicate','Countermeasures: encryption, firewall, antivirus, backups, strong authentication']}

 {t:'Ohm’s law in a loop',d:'A battery pushes charge round a closed loop through resistors. V = IR: with E = 12 V and R₁ = 4 Ω, R₂ = 2 Ω in series, I = 12/(4 + 2) = 2 A. The same current passes every series element; conventional current flows from the + terminal round to the −.'},

SC['beee:3']={cam:{yaw:-.4,pitch:.3},steps:[
 {t:'Diode, forward bias: the valve is open',d:'A p-n junction has a thin depletion layer. Connect + to p and − to n and the applied voltage shrinks that layer, so carriers cross and current flows once V exceeds the cut-in voltage (about 0.7 V for silicon, 0.3 V for germanium). Intrinsic and extrinsic semiconductors, and p-n junction construction, are the base of every device in this unit.'},

SC['math:0']={cam:{yaw:-.6,pitch:.5},steps:[
 {t:'Three equations are three sheets',d:'Each linear equation in x, y, z is a flat sheet in space. When three sheets meet at exactly one point, that point is the unique solution and r(A) = r([A|B]) = 3. Row reduction is just a tidy way of walking to that corner.'},
 {t:'Sheets sharing a line: infinitely many solutions',d:'If the third equation is just a mix of the first two, the three sheets all pass through one common line. Then r(A) = r([A|B]) = 2, which is less than 3 unknowns, so there is a free variable and infinitely many solutions.',only:true},

 {t:'Eigenvectors keep their direction',d:'A matrix usually turns and stretches a vector. An eigenvector is special: the matrix only stretches it. Here [[2,1],[1,2]] turns the circle into an ellipse, and the two axes of that ellipse are the eigenvectors with eigenvalues 3 and 1. Check: trace = 2 + 2 = 4 = 3 + 1, determinant = 3 = 3 × 1.',only:true}],

  B.s(2);plane(B,[0,1.1,0],[0,1,0],2.6,{f:COL.teal});plane(B,[0,-1.1,0],[0,1,0],2.6,{f:COL.gold});plane(B,[0,0,0],[1,.2,.3],2.6,{f:COL.pink});
  B.T([2.6,1.1,0],'sheet 1',{c:COL.teal});B.T([2.6,-1.1,0],'sheet 2 (parallel)',{c:COL.gold});B.T([0,3.2,0],'r(A) = 2, r(A|B) = 3 : no solution',{sz:22});
  B.s(3);B.C([0,0,0],1.4,{c:COL.teal,d:[5,4],w:2});B.F(a=>{const x=cos(a)*1.4,z=sin(a)*1.4;return[2*x+z,0,x+2*z]},0,2*PI,{c:COL.red,w:2.8,seg:60});
  const s2=1/sqrt(2);B.A([0,0,0],[1.4*s2,0,1.4*s2],{c:COL.teal,w:3});B.A([0,0,0],[3*1.4*s2,0,3*1.4*s2],{c:COL.red,w:3});B.A([0,0,0],[1.4*s2,0,-1.4*s2],{c:COL.teal,w:3});B.A([0,0,0],[1.4*s2,0,-1.4*s2],{c:COL.red,w:1});

SC['math:1']={cam:{yaw:-.45,pitch:.25},steps:[
 {t:'Rolle: same height at both ends means a flat spot',d:'If a smooth hill starts and ends at the same height, then somewhere between the ends the tangent must be perfectly flat (f′(c) = 0). Conditions that must be checked: continuous on [a, b], differentiable on (a, b), f(a) = f(b).'},

 {t:'Curvature is the circle that fits the bend',d:'At any point the curve is hugged by one circle, the circle of curvature. Its radius is ρ = 1/κ, with κ = y₂/(1 + y₁²)^(3/2). For y = x²/4 at the vertex y₁ = 0, y₂ = ½, so κ = ½ and ρ = 2: a gentle bend has a big circle.',only:true},
 {t:'L’Hôpital: compare slopes when 0/0',d:'sin x / x looks like 0/0 at x = 0. Near 0 the curve sin x and the line x leave the origin with slopes cos 0 = 1 and 1, so their ratio tends to 1. Differentiate top and bottom separately; repeat only while the form stays 0/0 or ∞/∞.',only:true}],

  B.T([-3,-.45,0],'a',{b:1});B.T([3,-.45,0],'b',{b:1});B.T([0,f(0)+.55,0],'f′(c) = 0',{c:COL.red,b:1,sz:23});B.T([0,-.6,0],'f(a) = f(b)',{c:COL.gray});
  const g=x=>1.2*sin(.9*x)+.35*x,gp=x=>1.08*cos(.9*x)+.35,m=(g(3)-g(-3))/6;let c0=-3,bd=9;for(let x=-2.9;x<2.9;x+=.01){const e=abs(gp(x)-m);if(e<bd){bd=e;c0=x}}
  B.s(1);axes(B,3.8,['x','f','']);ribbon(B,g,-3,3,.9,{f:COL.gold});B.L([[-3,g(-3),0],[3,g(3),0]],{c:COL.gray,d:[6,5],w:2});
  B.L([[c0-1.6,g(c0)-1.6*m,0],[c0+1.6,g(c0)+1.6*m,0]],{c:COL.red,w:3});B.D([c0,g(c0),0],.13,{f:COL.red});B.T([c0,g(c0)+.7,0],'tangent ∥ chord',{c:COL.red,b:1,sz:22});B.T([-3,g(-3)-.5,0],'A');B.T([3,g(3)+.5,0],'B');
  B.s(2);const p=x=>x*x/4;axes(B,3.8,['x','y','']);ribbon(B,p,-3,3,.9,{f:COL.teal});B.C([0,2,0],2,{n:'z',c:COL.red,w:2.6});B.L([[0,2,0],[0,0,0]],{c:COL.red,d:[5,4]});B.D([0,0,0],.13,{f:COL.red});B.D([0,2,0],.1,{f:COL.red});
  B.T([1.6,1.7,0],'ρ = 1/κ = 2',{c:COL.red,b:1,sz:24});B.T([0,3.3,0],'κ = y₂ / (1 + y₁²)^(3/2)',{sz:22});
  B.s(3);axes(B,3.8,['x','y','']);B.F(x=>[x,sin(x),0],-2.6,2.6,{c:COL.teal,w:3});B.F(x=>[x,x,-.8],-2.6,2.6,{c:COL.red,w:3});B.D([0,0,0],.13,{f:COL.ink});B.D([0,0,-.8],.13,{f:COL.ink});
  B.T([2.6,.9,0],'sin x',{c:COL.teal,b:1});B.T([2.2,2.7,-.8],'x',{c:COL.red,b:1});B.T([0,3.2,0],'lim sin x / x = cos 0 / 1 = 1',{sz:23,b:1})}};

SC['math:2']={cam:{yaw:-.65,pitch:.5},steps:[
 {t:'A surface z = f(x, y)',d:'A function of two variables is a landscape: height z above each point (x, y). This hill has one peak. At the top the ground is flat in every direction, which is the condition for a stationary point.'},
 {t:'Partial derivatives are slopes along two slices',d:'Freeze y and walk along x: the slope of that slice is fₓ. Freeze x and walk along y: that slope is f_y. At a peak both slopes are 0. Euler’s theorem for a homogeneous function of degree n then says x·fₓ + y·f_y = n·f.'},
 {t:'Saddle: flat but not a peak',d:'A stationary point can also be a saddle: up in one direction and down in the other. The test uses r = fₓₓ, s = fₓᵧ, t = f_yy. If rt − s² > 0 it is a max (r < 0) or min (r > 0); if rt − s² < 0 it is a saddle; if it equals 0 the test says nothing.',only:true},
 {t:'Lagrange: lowest point while staying on a path',d:'To minimise f = x² + y² while forced to stay on the line x + y = 1, follow the red path on the bowl. The lowest point on that path is where the level circle of f just touches the constraint line, so ∇f = λ∇φ. Build F = f + λφ and set all partial derivatives to zero.',only:true}],
 build(B){
  const h=(x,z)=>1.9*exp(-(x*x+z*z)/3.2);B.s(0);B.W(h,[-3.5,3.5],[-3.5,3.5],14,{c:COL.teal});B.D([0,h(0,0),0],.17,{f:COL.red});B.T([0,h(0,0)+.55,0],'peak: fₓ = f_y = 0',{c:COL.red,b:1,sz:22});B.T([0,-.3,3.9],'(x, y) plane',{c:COL.gray});
  B.s(1);B.F(x=>[x,h(x,1),1],-3.5,3.5,{c:COL.red,w:3.2});B.F(z=>[1.3,h(1.3,z),z],-3.5,3.5,{c:COL.blue,w:3.2});
  const sl=(x,z)=>-1.9*2*x/3.2*h(x,z)/1.9;B.L([[0,h(0,1),1],[2.5,h(0,1)+sl(0,1)*2.5,1]],{c:COL.red,d:[5,4]});
  B.D([1.3,h(1.3,1),1],.14,{f:COL.ink});B.T([-3,1.6,1],'slice y = const → fₓ',{c:COL.red,b:1});B.T([2.8,1.9,-3.1],'slice x = const → f_y',{c:COL.blue,b:1});B.T([0,3.3,0],'x fₓ + y f_y = n f',{sz:22});
  B.s(2);const sd=(x,z)=>.24*(x*x-z*z);B.W(sd,[-3.2,3.2],[-3.2,3.2],14,{c:COL.gold});B.D([0,0,0],.17,{f:COL.red});B.T([0,.8,0],'saddle: rt − s² < 0',{c:COL.red,b:1,sz:23});
  B.F(x=>[x,sd(x,0),0],-3.2,3.2,{c:COL.teal,w:3});B.F(z=>[0,sd(0,z),z],-3.2,3.2,{c:COL.red,w:3});B.T([3.2,2.7,0],'up this way',{c:COL.teal});B.T([0,-2.9,3.1],'down this way',{c:COL.red});
  B.s(3);const bw=(x,z)=>.28*(x*x+z*z);B.W(bw,[-3.2,3.2],[-3.2,3.2],14,{c:COL.gray});[.5,1,1.6,2.2].forEach(r=>B.C([0,0,0],r,{c:COL.teal,w:1.6}));
  B.F(x=>[x,bw(x,1-x),1-x],-1.4,2.4,{c:COL.red,w:3.2});B.L([[-1.6,0,2.6],[2.6,0,-1.6]],{c:COL.red,d:[6,5],w:2});B.D([.5,bw(.5,.5),.5],.16,{f:COL.red});B.T([0,3.1,0],'constraint x + y = 1',{c:COL.red,b:1});B.T([.9,1.1,.9],'∇f = λ∇φ',{c:COL.ink,b:1,sz:22,dx:60})}};

SC['math:3']={cam:{yaw:-.55,pitch:.55},steps:[
 {t:'Double integral = volume of thin columns',d:'Cut the floor into tiny squares dA and stand a column of height f(x, y) on each. Adding all columns gives the volume under the surface: ∬ f dA. Doing x first then y, or y first then x, adds the same columns in a different order.'},
 {t:'Change of order: slice the same region the other way',d:'For the triangle 0 ≤ y ≤ x ≤ 3, vertical strips (left) run y from 0 to x. Horizontal strips (right) run x from y to 3. Always draw the region first; read the new limits off the picture, never off the old formula.',only:true},
 {t:'Polar coordinates for round regions',d:'On a disc use r and θ. A tiny patch is almost a rectangle of sides dr and r dθ, so dA = r dr dθ. The extra factor r is the one students forget.',only:true},
 {t:'Spherical coordinates: r, θ, φ',d:'A point is described by its distance r, its angle θ down from the z-axis and its angle φ around it. The tiny box has sides dr, r dθ and r sinθ dφ, so dV = r² sinθ dr dθ dφ. Cylindrical is simpler: dV = r dr dθ dz.',only:true},
 {t:'Gamma and Beta: factorials for any number',d:'Γ(n + 1) = n·Γ(n), so Γ(n) = (n − 1)! for whole numbers: Γ(1) = 1, Γ(2) = 1, Γ(3) = 2, Γ(4) = 6. Also Γ(½) = √π. Beta links to Gamma: B(m, n) = Γ(m)Γ(n)/Γ(m + n), and B(m, n) = 2∫₀^(π/2) sin^(2m−1)θ cos^(2n−1)θ dθ.',only:true}],
 build(B){
  const f=(x,z)=>.5+.22*(x*x+z*z);B.s(0);for(let i=0;i<7;i++)for(let j=0;j<7;j++){const x=-2.7+i*.9,z=-2.7+j*.9;B.X([x,f(x,z)/2,z],[.8,f(x,z),.8],{f:COL.teal})}
  B.T([0,3.4,0],'∬ f(x, y) dA = Σ column volumes',{sz:23,b:1});
  B.s(1);const tri=(zc)=>B.P([[-3,0,zc-1.6],[3,0,zc+1.6],[-3,0,zc+1.6]],{f:COL.gold,a:.1});
  B.P([[-3.5,0,-2.9],[-.2,0,-2.9],[-.2,0,-.2],[-3.5,0,-.2]].map(p=>p),{f:COL.gray,a:.0,nostroke:true});
  B.P([[-3.3,0,-3],[-.5,0,-3],[-.5,0,-.3]],{f:COL.teal,a:.12});for(let i=0;i<=7;i++){const x=-3.3+i*.4;B.L([[x,0,-3],[x,0,-3+Math.max(0,(x+3.3))*(2.7/2.8)]],{c:COL.teal,w:1.8})}
  B.P([[.5,0,.3],[3.3,0,.3],[3.3,0,3]],{f:COL.red,a:.12});for(let i=0;i<=7;i++){const z=.3+i*.39;B.L([[.5+(z-.3)*(2.8/2.7),0,z],[3.3,0,z]],{c:COL.red,w:1.8})}
  B.T([-1.9,0,-3.5],'dy first: y from 0 to x',{c:COL.teal,b:1});B.T([1.9,0,3.6],'dx first: x from y to 3',{c:COL.red,b:1});B.T([0,2.4,0],'same region, two orders',{sz:23,b:1});
  B.s(2);[.8,1.6,2.4,3.2].forEach(r=>B.C([0,0,0],r,{c:COL.teal,w:1.6}));for(let a=0;a<12;a++)B.L([[0,0,0],[cos(a*PI/6)*3.2,0,sin(a*PI/6)*3.2]],{c:COL.teal,w:1});
  B.P([[1.6*cos(.5),0,1.6*sin(.5)],[2.4*cos(.5),0,2.4*sin(.5)],[2.4*cos(.8),0,2.4*sin(.8)],[1.6*cos(.8),0,1.6*sin(.8)]],{f:COL.red,a:.5,c:COL.red,w:2.4});
  B.T([3.2,.3,2.6],'dA = r dr dθ',{c:COL.red,b:1,sz:23});B.T([0,2.4,0],'x = r cosθ,  y = r sinθ',{sz:22});
  B.s(3);B.C([0,0,0],2.4,{n:'y',c:COL.teal,w:1.5});B.C([0,0,0],2.4,{n:'x',c:COL.teal,w:1.5});B.C([0,0,0],2.4,{n:'z',c:COL.teal,w:1.5});axes(B,3.4,['x','z','y']);
  const P=[1.5,1.6,1.2];B.A([0,0,0],P,{c:COL.red,w:3});B.L([[0,0,0],[P[0],0,P[2]]],{c:COL.gray,d:[5,4]});B.L([[P[0],0,P[2]],P],{c:COL.gray,d:[5,4]});B.D(P,.14,{f:COL.red});
  B.T([.4,1.1,.5],'r',{c:COL.red,b:1,sz:24});B.T([1.8,2.2,1.3],'P(r, θ, φ)',{c:COL.red,b:1});B.T([.3,1.9,0],'θ',{c:COL.blue,b:1,sz:24});B.T([1.2,0,.3],'φ',{c:COL.green,b:1,sz:24});B.T([0,-2.9,0],'dV = r² sinθ dr dθ dφ',{sz:23,b:1});
  B.s(4);axes(B,4,['x','Γ','']);B.F(x=>[x*1.1-3.2,Math.min(4.2,gam(x))*.9,0],.25,4.1,{c:COL.teal,w:3,seg:80});[1,2,3,4].forEach(n=>{B.D([n*1.1-3.2,gam(n)*.9,0],.13,{f:COL.red});B.T([n*1.1-3.2,gam(n)*.9+.5,0],'Γ('+n+') = '+gam(n).toFixed(0),{c:COL.red,b:1,sz:18})});
  B.D([.5*1.1-3.2,gam(.5)*.9,0],.13,{f:COL.gold});B.T([.5*1.1-3.2+.2,gam(.5)*.9+.5,0],'Γ(½) = √π ≈ 1.77',{c:COL.gold,b:1,sz:18,a:'left'})}};

SC['math:4']={cam:{yaw:-.6,pitch:.5},steps:[
 {t:'Gradient points straight uphill',d:'On the hill z = f(x, y), the gradient ∇f points in the steepest uphill direction and is always at right angles to the contour lines. The directional derivative along a unit vector û is ∇f · û; it is biggest when û points along ∇f.'},
 {t:'Divergence: source or drain',d:'Imagine a small closed surface. If more field leaves than enters, the divergence there is positive, like a tap. Field lines spreading from a point have ∇·F > 0; ∇·F = 0 means as much comes in as goes out.',only:true},

 {t:'De Broglie: matter has a wavelength',d:'Every moving particle behaves like a wave with λ = h/p = h/√(2mE). An electron accelerated through V volts has λ ≈ 12.27/√V Å, short enough that electron microscopes see finer detail than light. A stable orbit holds a whole number of waves: nλ = 2πr (here n = 5).'},

 {t:'Tunnelling: leaking through a wall',d:'When a wave meets a barrier taller than its energy it does not stop dead: inside the barrier it dies away exponentially and a smaller wave emerges on the far side. T ≈ e^(−2κa) with κ = √(2m(V₀ − E))/ħ, so thinner or lower barriers leak more.',only:true}],

SC['phy:4']={cam:{yaw:-.45,pitch:.3},steps:[
 {t:'Metal, semiconductor, insulator',d:'Electrons fill the valence band (VB). To conduct they need empty states in the conduction band (CB). In a metal the bands overlap, so electrons move freely. A semiconductor has a small gap (about 1 eV for silicon) that heat or doping can bridge. An insulator has a wide gap (several eV) that nothing at room temperature crosses.'},
 {t:'Doping and the Fermi level',d:'Donor atoms (n-type) add a level just below the CB and pull the Fermi level up towards it. Acceptor atoms (p-type) add a level just above the VB and pull the Fermi level down. In the pure (intrinsic) crystal it sits near mid-gap. Drift current is J = nqμE; diffusion follows the concentration gradient; D/μ = kT/q.',only:true},
 {t:'The p-n junction',d:'Electrons diffuse from n into p, holes from p into n. They leave behind fixed charged atoms, which form a depletion region with a built-in field pointing from n to p. Drift (pushed by that field) balances diffusion at equilibrium. This one-way valve is the diode; with a third layer it becomes a transistor, and LEDs and photodiodes are junctions too.',only:true},
 {t:'Hall effect',d:'Pass a current I along a slab and put a magnetic field B through it. The moving charges are pushed sideways and pile up on one face, creating a sideways voltage V_H = BI/(nqt). Its sign tells whether the carriers are electrons or holes, and R_H = 1/(nq) gives the carrier density.',only:true},
 {t:'Solar cell',d:'A photon with enough energy creates an electron–hole pair near the junction. The built-in field sweeps the electron to the n side and the hole to the p side, so current flows through the external load. Quality is measured by fill factor FF = Pmax/(I_sc V_oc) and efficiency = Pmax/Pin.',only:true},
 {t:'Nanomaterials: size changes properties',d:'When a material shrinks to a few nanometres a large share of its atoms sit on the surface (surface-to-volume ratio rises) and the electrons are squeezed, which widens the band gap and shifts colour and conductivity. Your syllabus classifies nanostructures by how many dimensions are confined: 0D quantum dot, 1D nanowire.',only:true}],

  [-1.4,0,1.4].forEach(x=>{B.F(y=>[x+sin(y*5)*.12,y,.6],4.4,1.5,{c:COL.gold,w:2.6});B.A([x,1.7,.6],[x,1.45,.6],{c:COL.gold,w:2.4})});B.T([0,4.7,0],'photons hν ≥ E_g',{c:COL.gold,b:1});
  B.D([-.4,.9,0],.14,{f:COL.teal});B.D([.4,.5,0],.14,{f:COL.red});B.L([[-2.4,1.2,0],[-4.2,1.2,0],[-4.2,-2.4,0],[4.2,-2.4,0],[4.2,-1.3,0]],{c:COL.ink,w:2.4});B.C([-4.2,-.6,0],.45,{n:'z',c:COL.gold,f:COL.gold,a:.5});B.T([-4.9,-.6,0],'load',{b:1});B.T([0,-3.2,0],'FF = Pmax /(I_sc V_oc)',{c:COL.red,b:1,sz:23});

SC['phy:5']={cam:{yaw:-.5,pitch:.4},steps:[
 {t:'Optics bench: Newton’s rings and grating',d:'Newton’s rings: a travelling microscope measures ring diameters; plot D² against ring number n, and the slope is 4λR. Grating on a spectrometer: turn the telescope to each order, read the angle θ, and λ = (a + b) sinθ/n. Polarimeter: S = θ/(l·c) for a sugar solution. Always write precautions and the percentage error.'},

SC['eic:0']={cam:{yaw:-.4,pitch:.25},steps:[
 {t:'The Preamble as a temple',d:'The Preamble is the Constitution’s introduction, and it rests on pillars: India is a Sovereign, Socialist, Secular, Democratic Republic. It secures to all citizens Justice, Liberty, Equality and Fraternity (the base). “Socialist”, “Secular” and “integrity” were added by the 42nd Amendment (1976). It opens with “We, the people of India”: the authority comes from the people.'},
 {t:'How it came to be',d:'The Constituent Assembly first met on 9 December 1946; its Drafting Committee was chaired by Dr. B. R. Ambedkar and the Assembly’s president was Dr. Rajendra Prasad. The Constitution was adopted on 26 November 1949 and came into force on 26 January 1950. Earlier steps: Acts of 1773, 1858, 1909, 1919 and 1935, the Cabinet Mission 1946 and the Objectives Resolution.',only:true},

SC['pps:1']={cam:{yaw:-.4,pitch:.4},steps:[
 {t:'1-D arrays: numbered boxes from 0',d:'An array is a row of boxes with indices 0 to n−1; the name is the address of box 0. Linear search walks the row comparing each value; keeping a running max (or min) while walking gives LE-4. Average = sum / n.'},

 {t:'Strings and pointers: characters ending in zero',d:'A C string is an array of characters ending with the null character ’\\0’. A pointer holds an address, so p + 1 means the next character. To reverse, swap from both ends moving inwards; to count vowels, loop until ’\\0’ and test each character. Note: your syllabus wording for LE-6 mixes “without pointer arithmetic” and “using pointers”; confirm with your teacher.',only:true}],

  B.s(0);const v=[7,3,9,4,12,5];v.forEach((x,i)=>{B.X([-4.2+i*1.7,0,0],[1.4,1.4,1.4],{f:COL.gold,a:.3});lab(B,[-4.2+i*1.7,.1,.8],''+x,{sz:30});lab(B,[-4.2+i*1.7,-1.2,0],'['+i+']',{sz:20,c:COL.gray})});B.dyn((t,b)=>{const k=Math.floor(t/.8)%8,i=Math.min(5,k);let mx=-1;for(let j=0;j<=i;j++)mx=Math.max(mx,v[j]);b.A([-4.2+i*1.7,1.9,0],[-4.2+i*1.7,1,0],{c:COL.red,w:3.2});lab(b,[-4.2+i*1.7,2.3,0],'i = '+i,{sz:22,c:COL.red});lab(b,[0,3.4,0],'max so far = '+mx,{sz:28,c:COL.teal})});lab(B,[0,-2.4,0],'index runs 0 … n−1',{sz:22});
  B.s(1);const cell=(ox,oz,n,c)=>{for(let i=0;i<n;i++)for(let j=0;j<n;j++)B.X([ox+j*.8,0,oz-i*.8],[.7,.3,.7],{f:c,a:.3})};cell(-4.4,.8,3,COL.teal);cell(-.6,-2.8,3,COL.gold);cell(-.6,.8,3,COL.red);lab(B,[-3.2,.5,2.2],'A',{sz:30,c:COL.teal});lab(B,[.6,.5,-3.3],'B',{sz:30,c:COL.gold});lab(B,[.6,.5,2.2],'C = A × B',{sz:26,c:COL.red});

SC['pps:2']={cam:{yaw:-.5,pitch:.3},steps:[
 {t:'Recursion builds a stack of calls',d:'factorial(4) calls factorial(3), which calls factorial(2), and so on until the base case factorial(0) = 1 stops it. Then each call returns and multiplies on the way back: 1, 1, 2, 6, 24. Every call needs its own stack frame, so recursion uses more memory than a loop. Euclid’s GCD: gcd(a, b) = gcd(b, a % b) until b = 0. LE-7.'},
 {t:'Call by value versus call by reference',d:'By value, the function gets a photocopy of the variable, so changing it inside does not change the original. By reference (passing the address with a pointer) the function edits the original, which is how swap(&a, &b) works: temp = *a; *a = *b; *b = temp. Arrays are passed by address. LE-8.',only:true}],
 build(B){
  B.s(0);B.dyn((t,b)=>{const T=14,k=(t%T)/T*14,fr=['factorial(4)','factorial(3)','factorial(2)','factorial(1)','factorial(0) = 1'];const up=Math.min(5,Math.floor(k/1.1)),down=Math.max(0,Math.floor((k-6.6)/1.1));const n=k<6.6?up:5-down;for(let i=0;i<n;i++){b.X([0,-2.4+i*1.2,0],[4.6,.9,2],{f:i===4?COL.red:COL.teal,a:.3});lab(b,[0,-2.4+i*1.2,1.1],fr[i],{sz:22})}const ret=[1,1,2,6,24];if(k>=6.6&&5-down<5&&down<5)lab(b,[3.8,-2.4+(4-down)*1.2,0],'returns '+ret[down],{sz:24,c:COL.red,a:'left'});lab(b,[0,3.8,0],k<6.6?'calls pile up ↑':'returns multiply on the way back ↓',{sz:25,c:COL.red})});lab(B,[-5,-2.4,0],'stack',{sz:22,c:COL.gray});
  B.s(1);B.X([-3,.6,0],[2,.9,1],{f:COL.gold,a:.3});lab(B,[-3,.6,.6],'a = 5',{sz:24});B.X([-3,-1,0],[2,.9,1],{f:COL.red,a:.3});lab(B,[-3,-1,.6],'x = 5  (copy)',{sz:20});B.A([-3,.1,0],[-3,-.55,0],{c:COL.red,w:2.2});lab(B,[-3,-2.2,0],'x = 9 changes only the copy',{sz:19,c:COL.red});lab(B,[-3,2.2,0],'call by value',{sz:25});

SC['pps:3']={cam:{yaw:-.4,pitch:.35},steps:[
 {t:'Structure versus union memory (LE-9)',d:'A structure keeps all members side by side, so its size is at least the sum of the members (the compiler may add padding). A union keeps all members on top of each other in the same space, so only one is valid at a time and its size is that of the largest member. Check both with sizeof(). The employee payroll program groups name, id and salary in one struct.'},
 {t:'File handling (LE-10)',d:'A file lets data outlive the program. fopen(name, mode) opens it: "w" write (erases old content), "r" read, "a" append. Always test the result against NULL, use fprintf or fscanf to write and read records, and fclose() when done. Searching for a keyword: read each line with fgets and test with strstr.',only:true}],

 {t:'Constructor and destructor (LE-12)',d:'A constructor runs automatically when an object is created: same name as the class, no return type. Overloaded forms: default, parameterised and copy constructor (takes const ClassName&; essential when the class owns dynamic memory, as a String class does). The destructor ~ClassName() runs when the object dies and cleans up.',only:true},
 {t:'Static members and friends (LE-13)',d:'A static member belongs to the class, not to any object: all objects share one copy (a counter of how many accounts exist). A friend function is not a member but is allowed to read the class’s private members; use it sparingly.',only:true}],

SC['pps:5']={cam:{yaw:-.4,pitch:.3},steps:[
 {t:'Five types of inheritance (LE-14)',d:'Single: one parent, one child. Multiple: one child, two parents. Multilevel: a chain A → B → C. Hierarchical: one parent, many children. Hybrid: a mix, which can create the diamond problem (a shared grandparent copied twice); virtual inheritance fixes it by sharing one copy.'},
 {t:'Polymorphism and abstract classes (LE-15)',d:'One name, many behaviours: a Shape pointer calling area() runs the circle’s, square’s or triangle’s version at run time (virtual function). A class with a pure virtual function (virtual double area() = 0;) is abstract and cannot be instantiated. Function overloading: same name, different parameters. Operator overloading: Complex operator+(Complex c) makes c1 + c2 work.',only:true},
 {t:'Exceptions and templates (LE-16, 17)',d:'try { … throw x; } catch (type e) { … }: when something goes wrong (division by zero) throw jumps to the matching catch instead of crashing. A template writes code once for any type: template <typename T> T maxOf(T a, T b) { return a > b ? a : b; } works for int, float and char; a class template like pair<T1,T2> does the same for data.',only:true}],

 let left=null,now=null;if(st.exam){const d=Math.ceil((new Date(st.exam+'T00:00:00')-new Date(new Date().toDateString()))/864e5);left=d;now=d<=0?'Exam':'W−'+Math.min(6,Math.ceil(d/7))}
 const fm=D.reduce((n,s)=>n+s.fm.length,0);
 $('#mw').innerHTML=`<div class="mh"><div><h2>Exam plan</h2><p style="font-size:13px;color:var(--dim);margin-top:6px">From your real timetable (revised, w.e.f. 28.09.26, Room 13) and the Group A syllabus credits.</p></div><button class="btn" id="mx">Close</button></div>

 <div class="ms"><h3><span>2</span>Six-week countdown</h3><div class="xd"><label for="exam">My exam starts on</label><input type="date" id="exam" value="${esc(st.exam)}">${left===null?'<span>Pick a date to highlight the current week.</span>':`<b>${left>0?left+' days left':left===0?'Exam day':'Exam started'}</b>`}</div>${WEEKS.map(w=>`<div class="wk ${now===w.w?'now':''}"><div><b>${w.w}</b><small>${esc(w.t)}</small></div><ul>${w.d.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>
 <div class="ms"><h3><span>3</span>Free marks</h3><p class="l">${fm} questions you can know in advance. Do these first.</p><div class="fm">${D.map(s=>`<div class="g"><h4>${esc(s.co)}</h4><ul>${s.fm.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></div>
 <div class="ms"><h3><span>4</span>Exam-day rules</h3><ol class="rl">${RULES.map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div>
 <div class="ms"><h3><span>5</span>Memory hooks</h3>${D.map(s=>`<div class="hk"><b>${esc(s.co)}</b><span>${esc(s.hook)}</span></div>`).join('')}</div>`}
