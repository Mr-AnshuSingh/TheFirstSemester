<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Warm paper and lighting gradients -->
    <radialGradient id="paperBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffef9" />
      <stop offset="100%" stop-color="#f6f0e1" />
    </radialGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2b2a28" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- App Rounded Icon Shield / Paper Tile -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#paperBg)" stroke="#2b2a28" stroke-width="4.5" filter="url(#softShadow)" />

  <!-- Technical Grid Texture -->
  <g stroke="#2b2a28" stroke-width="0.75" stroke-opacity="0.12" stroke-dasharray="2,3">
    <line x1="12" y1="64" x2="244" y2="64" />
    <line x1="12" y1="112" x2="244" y2="112" />
    <line x1="12" y1="160" x2="244" y2="160" />
    <line x1="12" y1="208" x2="244" y2="208" />
    <line x1="64" y1="12" x2="64" y2="244" />
    <line x1="112" y1="12" x2="112" y2="244" />
    <line x1="160" y1="12" x2="160" y2="244" />
    <line x1="208" y1="12" x2="208" y2="244" />
  </g>

  <!-- Terracotta Bookmark Ribbon on Top-Left -->
  <path d="M 44,12 L 44,56 L 56,46 L 68,56 L 68,12 Z" fill="#c85025" stroke="#2b2a28" stroke-width="2" />

  <!-- Isometric 3D Wireframe Cube Core -->
  <g stroke="#2b2a28" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Face -->
    <polygon points="128,52 188,86 128,120 68,86" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <polygon points="68,86 128,120 128,188 68,154" fill="url(#cubeLeft)" fill-opacity="0.9" />
    <!-- Right Face -->
    <polygon points="128,120 188,86 188,154 128,188" fill="url(#cubeRight)" fill-opacity="0.9" />

    <!-- Inner Dimension Axes -->
    <line x1="128" y1="120" x2="128" y2="60" stroke="#c85025" stroke-width="2.5" stroke-dasharray="3,3" />
    <line x1="128" y1="120" x2="180" y2="90" stroke="#10b981" stroke-width="2.5" stroke-dasharray="3,3" />
    <line x1="128" y1="120" x2="76" y2="90" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="3,3" />

    <!-- Center Origin Dot -->
    <circle cx="128" cy="120" r="4" fill="#c85025" stroke="#2b2a28" stroke-width="1.5" />
  </g>

  <!-- Mathematical Compass Arc Overlay -->
  <path d="M 68,110 A 70,70 0 0,1 188,110" fill="none" stroke="#b8810b" stroke-width="2.5" stroke-dasharray="5,4" />

  <!-- Floating Mathematical Symbols -->
  <g font-family="monospace" font-size="13" font-weight="bold" fill="#2b2a28" opacity="0.8">
    <text x="78" y="76">∇</text>
    <text x="168" y="76">∫</text>
    <text x="96" y="166">λ</text>
    <text x="150" y="166">∑</text>
  </g>

  <!-- Bottom Label Banner -->
  <g text-anchor="middle">
    <text x="128" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#2b2a28">
      SEMESTER I · 3D
    </text>
    <text x="128" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#c85025">
      LNJPIT CHAPRA
    </text>
  </g>
</svg>
