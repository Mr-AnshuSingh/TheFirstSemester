<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <rect width="920" height="390" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Unit 2 Optical Fiber: Acceptance Cone, Total Internal Reflection &amp; Step/Graded Index</text>

  <!-- LEFT: TIR & ACCEPTANCE ANGLE -->
  <rect x="20" y="45" width="560" height="325" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="300" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a8a">(a) Structure, Acceptance Angle (θₐ) &amp; Total Internal Reflection</text>

  <!-- Buffer Jacket -->
  <rect x="190" y="100" width="370" height="200" rx="4" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <!-- Cladding n2 -->
  <rect x="190" y="122" width="370" height="156" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <!-- Core n1 > n2 -->
  <rect x="190" y="160" width="370" height="80" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Fiber Axis -->
  <line x1="40" y1="200" x2="570" y2="200" stroke="#475569" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="65" y="192" font-family="Arial, sans-serif" font-size="10" fill="#475569">Optical Axis</text>

  <!-- Acceptance Cone shading -->
  <polygon points="70,138 190,200 70,262" fill="#fde047" fill-opacity="0.25" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="58" y="128" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">Acceptance Cone (2θₐ)</text>
  <text x="95" y="176" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">θₐ</text>
  <text x="155" y="194" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">θr</text>
  <text x="52" y="218" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">Air (n₀)</text>

  <!-- Guided Ray entering at θa and undergoing TIR -->
  <polyline points="82,144 190,200 275,160 390,240 505,160 560,198" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <!-- Normal at core-cladding reflection -->
  <line x1="275" y1="138" x2="275" y2="190" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="281" y="152" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a">θ ≥ θc</text>

  <!-- Escaping ray outside cone -->
  <polyline points="92,272 190,200 250,160 292,115" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="296" y="114" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Unbound ray (i &gt; θₐ escapes)</text>

  <!-- Layer Labels -->
  <text x="480" y="115" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Buffer / Jacket</text>
  <text x="480" y="145" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">Cladding (n₂ &lt; n₁)</text>
  <text x="470" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#854d0e">Core (n₁)</text>

  <rect x="40" y="315" width="520" height="44" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="300" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">NA = n₀ sin θₐ = √(n₁² − n₂²) ≈ n₁√(2Δ)    |    θc = sin⁻¹(n₂/n₁)</text>
  <text x="300" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">Normalized Frequency V = (2πa/λ) NA   |   Single mode if V &lt; 2.405</text>

  <!-- RIGHT: TYPES OF FIBERS -->
  <rect x="595" y="45" width="305" height="325" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="747" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a8a">(b) Index Profiles &amp; Modes</text>

  <!-- 1. Single Mode Step Index -->
  <text x="615" y="95" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">1. Single-Mode Step Index (2a ~ 8–10 μm)</text>
  <rect x="615" y="102" width="160" height="46" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="615" y="121" width="160" height="8" fill="#fef08a" stroke="#ca8a04"/>
  <line x1="615" y1="125" x2="775" y2="125" stroke="#dc2626" stroke-width="2"/>
  <!-- Profile graph -->
  <polyline points="805,146 805,129 830,129 830,121 805,121 805,104" fill="none" stroke="#1e3a8a" stroke-width="2"/>
  <text x="850" y="128" font-family="Arial, sans-serif" font-size="9.5" fill="#1e3a8a">No modal</text>
  <text x="850" y="140" font-family="Arial, sans-serif" font-size="9.5" fill="#1e3a8a">dispersion</text>

  <!-- 2. Multi-Mode Step Index -->
  <text x="615" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">2. Multi-Mode Step Index (2a ~ 50–100 μm)</text>
  <rect x="615" y="184" width="160" height="58" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="615" y="196" width="160" height="34" fill="#fef08a" stroke="#ca8a04"/>
  <polyline points="615,213 655,196 695,230 735,196 775,218" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <polyline points="615,213 775,213" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <polyline points="805,240 805,230 835,230 835,196 805,196 805,186" fill="none" stroke="#1e3a8a" stroke-width="2"/>
  <text x="850" y="210" font-family="Arial, sans-serif" font-size="9.5" fill="#dc2626">High pulse</text>
  <text x="850" y="222" font-family="Arial, sans-serif" font-size="9.5" fill="#dc2626">spreading</text>

  <!-- 3. Graded Index (GRIN) -->
  <text x="615" y="268" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">3. Graded-Index (GRIN — Parabolic n(r))</text>
  <rect x="615" y="276" width="160" height="58" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="615" y="288" width="160" height="34" fill="#fef08a" stroke="#ca8a04"/>
  <path d="M 615 305 Q 655 278 695 305 T 775 305" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <path d="M 615 305 Q 655 332 695 305 T 775 305" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M 805 332 L 805 322 Q 860 305 805 288 L 805 278" fill="none" stroke="#1e3a8a" stroke-width="2"/>
  <text x="850" y="302" font-family="Arial, sans-serif" font-size="9.5" fill="#16a34a">Rays refocus</text>
  <text x="850" y="314" font-family="Arial, sans-serif" font-size="9.5" fill="#16a34a">periodically</text>

  <text x="747" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#334155">Attenuation: α (dB/km) = (10/L) log₁₀(P_in / P_out)</text>
</svg>