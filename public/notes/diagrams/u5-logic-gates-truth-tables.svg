<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="920" height="500" rx="14" fill="#0f172a"/>
  <text x="460" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Logic Gates, Universal Realization (NAND/NOR), Truth Tables &amp; Boolean Laws</text>

  <!-- Panel 1: Gates & Universal NAND Realization -->
  <rect x="20" y="48" width="430" height="225" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="235" y="70" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">1. Basic Gates from NAND (Universal Gate)</text>
  <!-- NOT from NAND -->
  <text x="40" y="96" fill="#4ade80" font-size="11" font-weight="700">NOT (A'): 1 NAND</text>
  <line x1="40" y1="120" x2="65" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="65" y1="108" x2="65" y2="132" stroke="#94a3b8" stroke-width="2"/>
  <line x1="65" y1="108" x2="82" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <line x1="65" y1="132" x2="82" y2="132" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 82 102 L 100 102 A 18 18 0 0 1 100 138 L 82 138 Z" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <circle cx="122" cy="120" r="4" fill="none" stroke="#4ade80" stroke-width="2"/>
  <line x1="126" y1="120" x2="155" y2="120" stroke="#4ade80" stroke-width="2"/>
  <text x="160" y="124" fill="#cbd5e1" font-size="11">Y = A'</text>

  <!-- AND from NAND -->
  <text x="40" y="170" fill="#fde047" font-size="11" font-weight="700">AND (A·B): 2 NANDs</text>
  <line x1="40" y1="188" x2="72" y2="188" stroke="#94a3b8" stroke-width="2"/>
  <line x1="40" y1="208" x2="72" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 72 180 L 90 180 A 18 18 0 0 1 90 216 L 72 216 Z" fill="#334155" stroke="#fde047" stroke-width="2"/>
  <circle cx="112" cy="198" r="4" fill="none" stroke="#fde047" stroke-width="2"/>
  <line x1="116" y1="198" x2="138" y2="198" stroke="#fde047" stroke-width="2"/>
  <line x1="138" y1="186" x2="138" y2="210" stroke="#fde047" stroke-width="2"/>
  <line x1="138" y1="186" x2="152" y2="186" stroke="#fde047" stroke-width="2"/>
  <line x1="138" y1="210" x2="152" y2="210" stroke="#fde047" stroke-width="2"/>
  <path d="M 152 180 L 170 180 A 18 18 0 0 1 170 216 L 152 216 Z" fill="#334155" stroke="#fde047" stroke-width="2"/>
  <circle cx="192" cy="198" r="4" fill="none" stroke="#fde047" stroke-width="2"/>
  <line x1="196" y1="198" x2="222" y2="198" stroke="#fde047" stroke-width="2"/>
  <text x="228" y="202" fill="#cbd5e1" font-size="11">Y = A·B</text>

  <!-- Gate counts table -->
  <rect x="260" y="88" width="175" height="168" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="347" y="108" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">NAND / NOR Counts</text>
  <text x="272" y="130" fill="#4ade80" font-size="11">NOT : 1 NAND | 1 NOR</text>
  <text x="272" y="150" fill="#fde047" font-size="11">AND : 2 NAND | 3 NOR</text>
  <text x="272" y="170" fill="#38bdf8" font-size="11">OR  : 3 NAND | 2 NOR</text>
  <text x="272" y="190" fill="#f472b6" font-size="11">XOR : 4 NAND | 5 NOR</text>
  <text x="272" y="216" fill="#cbd5e1" font-size="10">De Morgan's Theorems:</text>
  <text x="272" y="234" fill="#93c5fd" font-size="10">(A+B)' = A'·B' | (A·B)' = A'+B'</text>
  <text x="40" y="252" fill="#94a3b8" font-size="10">XOR: Y = A'B + AB' | XNOR: Y = AB + A'B'</text>

  <!-- Panel 2: Standard Logic Gate Symbols & Expressions -->
  <rect x="470" y="48" width="430" height="225" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="685" y="70" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">2. Standard Logic Gate Symbols &amp; Expressions</text>

  <!-- AND -->
  <text x="490" y="102" fill="#fde047" font-size="11" font-weight="700">AND (A·B)</text>
  <line x1="490" y1="114" x2="515" y2="114" stroke="#94a3b8" stroke-width="2"/>
  <line x1="490" y1="128" x2="515" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 515 107 L 533 107 A 14 14 0 0 1 533 135 L 515 135 Z" fill="#334155" stroke="#fde047" stroke-width="2"/>
  <line x1="547" y1="121" x2="572" y2="121" stroke="#fde047" stroke-width="2"/>

  <!-- OR -->
  <text x="595" y="102" fill="#38bdf8" font-size="11" font-weight="700">OR (A+B)</text>
  <line x1="595" y1="114" x2="623" y2="114" stroke="#94a3b8" stroke-width="2"/>
  <line x1="595" y1="128" x2="623" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 618 107 Q 626 121 618 135 Q 642 135 654 121 Q 642 107 618 107 Z" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <line x1="654" y1="121" x2="679" y2="121" stroke="#38bdf8" stroke-width="2"/>

  <!-- NOT -->
  <text x="705" y="102" fill="#4ade80" font-size="11" font-weight="700">NOT (A')</text>
  <line x1="705" y1="121" x2="730" y2="121" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="730,108 730,134 756,121" fill="#334155" stroke="#4ade80" stroke-width="2"/>
  <circle cx="760" cy="121" r="4" fill="none" stroke="#4ade80" stroke-width="2"/>
  <line x1="764" y1="121" x2="790" y2="121" stroke="#4ade80" stroke-width="2"/>

  <!-- NAND -->
  <text x="490" y="172" fill="#f472b6" font-size="11" font-weight="700">NAND ((AB)')</text>
  <line x1="490" y1="184" x2="515" y2="184" stroke="#94a3b8" stroke-width="2"/>
  <line x1="490" y1="198" x2="515" y2="198" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 515 177 L 533 177 A 14 14 0 0 1 533 205 L 515 205 Z" fill="#334155" stroke="#f472b6" stroke-width="2"/>
  <circle cx="551" cy="191" r="4" fill="none" stroke="#f472b6" stroke-width="2"/>
  <line x1="555" y1="191" x2="578" y2="191" stroke="#f472b6" stroke-width="2"/>

  <!-- NOR -->
  <text x="595" y="172" fill="#fb923c" font-size="11" font-weight="700">NOR ((A+B)')</text>
  <line x1="595" y1="184" x2="623" y2="184" stroke="#94a3b8" stroke-width="2"/>
  <line x1="595" y1="198" x2="623" y2="198" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 618 177 Q 626 191 618 205 Q 642 205 654 191 Q 642 177 618 177 Z" fill="#334155" stroke="#fb923c" stroke-width="2"/>
  <circle cx="658" cy="191" r="4" fill="none" stroke="#fb923c" stroke-width="2"/>
  <line x1="662" y1="191" x2="684" y2="191" stroke="#fb923c" stroke-width="2"/>

  <!-- XOR -->
  <text x="705" y="172" fill="#a78bfa" font-size="11" font-weight="700">XOR (A⊕B)</text>
  <line x1="705" y1="184" x2="730" y2="184" stroke="#94a3b8" stroke-width="2"/>
  <line x1="705" y1="198" x2="730" y2="198" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 724 177 Q 732 191 724 205" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M 731 177 Q 739 191 731 205 Q 755 205 767 191 Q 755 177 731 177 Z" fill="#334155" stroke="#a78bfa" stroke-width="2"/>
  <line x1="767" y1="191" x2="790" y2="191" stroke="#a78bfa" stroke-width="2"/>

  <!-- Key takeaways -->
  <rect x="490" y="220" width="390" height="40" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="685" y="237" text-anchor="middle" fill="#e2e8f0" font-size="10.5">Universal Gates: <tspan fill="#f472b6" font-weight="700">NAND</tspan> &amp; <tspan fill="#fb923c" font-weight="700">NOR</tspan> can realize every Boolean function</text>
  <text x="685" y="252" text-anchor="middle" fill="#94a3b8" font-size="10">XNOR = (A⊕B)' = AB + A'B' (Outputs 1 when A = B)</text>

  <!-- Panel 3: Complete 2-Input Truth Tables & Key Boolean Laws -->
  <rect x="20" y="288" width="880" height="194" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="275" y="312" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700">3. Complete 2-Input Gate Truth Tables</text>
  <text x="700" y="312" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">4. Core Boolean Algebra Identities</text>

  <!-- Truth table grid -->
  <rect x="38" y="324" width="475" height="142" rx="6" fill="#0f172a" stroke="#475569"/>
  <line x1="38" y1="352" x2="513" y2="352" stroke="#475569"/>
  <text x="62" y="343" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">A</text>
  <text x="96" y="343" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">B</text>
  <text x="142" y="343" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">NOT A</text>
  <text x="196" y="343" text-anchor="middle" fill="#fde047" font-size="11" font-weight="700">AND</text>
  <text x="248" y="343" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">OR</text>
  <text x="304" y="343" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="700">NAND</text>
  <text x="360" y="343" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">NOR</text>
  <text x="418" y="343" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">XOR</text>
  <text x="476" y="343" text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="700">XNOR</text>

  <text x="62" y="376" text-anchor="middle" fill="#cbd5e1" font-size="11">0</text>
  <text x="96" y="376" text-anchor="middle" fill="#cbd5e1" font-size="11">0</text>
  <text x="142" y="376" text-anchor="middle" fill="#4ade80" font-size="11">1</text>
  <text x="196" y="376" text-anchor="middle" fill="#fde047" font-size="11">0</text>
  <text x="248" y="376" text-anchor="middle" fill="#38bdf8" font-size="11">0</text>
  <text x="304" y="376" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="700">1</text>
  <text x="360" y="376" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">1</text>
  <text x="418" y="376" text-anchor="middle" fill="#a78bfa" font-size="11">0</text>
  <text x="476" y="376" text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="700">1</text>

  <text x="62" y="402" text-anchor="middle" fill="#cbd5e1" font-size="11">0</text>
  <text x="96" y="402" text-anchor="middle" fill="#cbd5e1" font-size="11">1</text>
  <text x="142" y="402" text-anchor="middle" fill="#4ade80" font-size="11">1</text>
  <text x="196" y="402" text-anchor="middle" fill="#fde047" font-size="11">0</text>
  <text x="248" y="402" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">1</text>
  <text x="304" y="402" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="700">1</text>
  <text x="360" y="402" text-anchor="middle" fill="#fb923c" font-size="11">0</text>
  <text x="418" y="402" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">1</text>
  <text x="476" y="402" text-anchor="middle" fill="#2dd4bf" font-size="11">0</text>

  <text x="62" y="428" text-anchor="middle" fill="#cbd5e1" font-size="11">1</text>
  <text x="96" y="428" text-anchor="middle" fill="#cbd5e1" font-size="11">0</text>
  <text x="142" y="428" text-anchor="middle" fill="#4ade80" font-size="11">0</text>
  <text x="196" y="428" text-anchor="middle" fill="#fde047" font-size="11">0</text>
  <text x="248" y="428" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">1</text>
  <text x="304" y="428" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="700">1</text>
  <text x="360" y="428" text-anchor="middle" fill="#fb923c" font-size="11">0</text>
  <text x="418" y="428" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">1</text>
  <text x="476" y="428" text-anchor="middle" fill="#2dd4bf" font-size="11">0</text>

  <text x="62" y="454" text-anchor="middle" fill="#cbd5e1" font-size="11">1</text>
  <text x="96" y="454" text-anchor="middle" fill="#cbd5e1" font-size="11">1</text>
  <text x="142" y="454" text-anchor="middle" fill="#4ade80" font-size="11">0</text>
  <text x="196" y="454" text-anchor="middle" fill="#fde047" font-size="11" font-weight="700">1</text>
  <text x="248" y="454" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">1</text>
  <text x="304" y="454" text-anchor="middle" fill="#f472b6" font-size="11">0</text>
  <text x="360" y="454" text-anchor="middle" fill="#fb923c" font-size="11">0</text>
  <text x="418" y="454" text-anchor="middle" fill="#a78bfa" font-size="11">0</text>
  <text x="476" y="454" text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="700">1</text>

  <!-- Boolean Laws box -->
  <rect x="530" y="324" width="352" height="142" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="546" y="346" fill="#4ade80" font-size="11" font-weight="700">Identity &amp; Null:</text>
  <text x="655" y="346" fill="#e2e8f0" font-size="11">A+0=A | A·1=A | A+1=1 | A·0=0</text>
  <text x="546" y="372" fill="#fde047" font-size="11" font-weight="700">Complement:</text>
  <text x="655" y="372" fill="#e2e8f0" font-size="11">A+A'=1 | A·A'=0 | (A')'=A</text>
  <text x="546" y="398" fill="#38bdf8" font-size="11" font-weight="700">Absorption:</text>
  <text x="655" y="398" fill="#e2e8f0" font-size="11">A+AB=A | A(A+B)=A | A+A'B=A+B</text>
  <text x="546" y="424" fill="#f472b6" font-size="11" font-weight="700">Distributive:</text>
  <text x="655" y="424" fill="#e2e8f0" font-size="11">A+BC = (A+B)(A+C)</text>
  <text x="546" y="450" fill="#fb923c" font-size="11" font-weight="700">De Morgan:</text>
  <text x="655" y="450" fill="#e2e8f0" font-size="11">(A+B)' = A'·B'  |  (A·B)' = A' + B'</text>
</svg>
