<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420">
  <rect width="920" height="420" rx="12" fill="#fcfaf3" stroke="#2b2a28" stroke-width="2"/>
  <text x="460" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2b2a28">Unit 2 AC Circuits: Sine Waveforms, Impedance/Power Triangles &amp; 3-Phase Star/Delta</text>

  <!-- PANEL 1: AC SINE WAVE & FACTORS -->
  <rect x="20" y="45" width="280" height="355" rx="8" fill="#efe7d2" stroke="#555046"/>
  <text x="160" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(a) Sinusoid &amp; Phasor (Lag/Lead)</text>

  <line x1="35" y1="160" x2="285" y2="160" stroke="#2b2a28" stroke-width="1.5"/>
  <line x1="45" y1="90" x2="45" y2="230" stroke="#2b2a28" stroke-width="1.5"/>
  <!-- Voltage wave -->
  <path d="M 45 160 Q 75 90 105 160 T 165 160 T 225 160 T 275 130" fill="none" stroke="#9e3512" stroke-width="2.4"/>
  <!-- Lagging Current wave -->
  <path d="M 65 160 Q 95 115 125 160 T 185 160 T 245 160" fill="none" stroke="#1e6e67" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="82" y="102" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9e3512">v = Vₘ sin ωt</text>
  <text x="135" y="128" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e6e67">i (lags φ)</text>
  <line x1="45" y1="115" x2="275" y2="115" stroke="#13534d" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="275" y="110" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="bold" fill="#13534d">V_rms = 0.707 Vₘ</text>

  <rect x="35" y="250" width="250" height="135" rx="5" fill="#f6f0e1" stroke="#555046"/>
  <text x="160" y="270" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e6e67">V_rms = Vₘ / √2 ≈ 0.707 Vₘ</text>
  <text x="160" y="290" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e6e67">V_avg (half-cycle) = 2Vₘ/π ≈ 0.637 Vₘ</text>
  <text x="160" y="312" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9e3512">Form Factor (k_f) = V_rms/V_avg = 1.11</text>
  <text x="160" y="332" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#13534d">Peak Factor (k_p) = Vₘ/V_rms = 1.414</text>
  <text x="160" y="356" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#2b2a28">Pure L: i lags 90° | Pure C: i leads 90°</text>
  <text x="160" y="373" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#2b2a28">Series Resonance: ω₀ = 1/√(LC), Q = (1/R)√(L/C)</text>

  <!-- PANEL 2: IMPEDANCE & POWER TRIANGLES -->
  <rect x="310" y="45" width="295" height="355" rx="8" fill="#efe7d2" stroke="#555046"/>
  <text x="457" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(b) Impedance &amp; Power Triangles</text>

  <!-- Impedance triangle -->
  <polygon points="345,195 515,195 515,100" fill="#e6dcc3" fill-opacity="0.5" stroke="#1e6e67" stroke-width="2.2"/>
  <text x="430" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2b2a28">R (Resistance, Ω)</text>
  <text x="522" y="150" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">X = X_L − X_C</text>
  <text x="415" y="140" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e6e67">Z = √(R² + X²)</text>
  <text x="378" y="187" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8f6200">φ</text>

  <!-- Power triangle -->
  <polygon points="345,335 515,335 515,245" fill="#e6dcc3" fill-opacity="0.5" stroke="#13534d" stroke-width="2.2"/>
  <text x="430" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#13534d">P = V I cos φ (Real, W)</text>
  <text x="522" y="295" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">Q = V I sin φ (VAR)</text>
  <text x="415" y="282" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#13534d">S = V I (VA)</text>
  <text x="378" y="327" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8f6200">φ</text>

  <text x="457" y="378" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#2b2a28">Power Factor cos φ = P/S = R/Z  |  Y = 1/Z = G + jB</text>

  <!-- PANEL 3: 3-PHASE STAR & DELTA -->
  <rect x="615" y="45" width="285" height="355" rx="8" fill="#efe7d2" stroke="#555046"/>
  <text x="757" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(c) 3-Phase Balanced Systems</text>

  <!-- Star connection -->
  <line x1="700" y1="150" x2="700" y2="100" stroke="#9e3512" stroke-width="2.2"/>
  <line x1="700" y1="150" x2="655" y2="180" stroke="#b8810b" stroke-width="2.2"/>
  <line x1="700" y1="150" x2="745" y2="180" stroke="#1e6e67" stroke-width="2.2"/>
  <circle cx="700" cy="150" r="4" fill="#2b2a28"/>
  <text x="700" y="166" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold">N</text>
  <text x="700" y="94" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9e3512">R</text>
  <text x="645" y="185" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#8f6200">Y</text>
  <text x="755" y="185" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e6e67">B</text>
  <text x="828" y="128" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e6e67">Star (Y):</text>
  <text x="828" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">V_L = √3 V_ph</text>
  <text x="828" y="164" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">I_L = I_ph</text>

  <!-- Delta connection -->
  <polygon points="700,215 655,285 745,285" fill="none" stroke="#8f6200" stroke-width="2.2"/>
  <text x="828" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8f6200">Delta (Δ):</text>
  <text x="828" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">V_L = V_ph</text>
  <text x="828" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">I_L = √3 I_ph</text>

  <rect x="630" y="308" width="255" height="77" rx="5" fill="#f6f0e1" stroke="#555046"/>
  <text x="757" y="328" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e6e67">3-Phase Power (Both Y &amp; Δ):</text>
  <text x="757" y="348" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#13534d">P = √3 V_L I_L cos φ = 3 V_ph I_ph cos φ</text>
  <text x="757" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#2b2a28">2-Wattmeter: P = W₁ + W₂, tan φ = √3(W₁−W₂)/(W₁+W₂)</text>
</svg>