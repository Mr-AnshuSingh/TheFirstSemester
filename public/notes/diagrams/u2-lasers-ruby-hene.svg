<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
  <rect width="920" height="440" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Unit 2 Lasers: Ruby (3-Level) &amp; He-Ne (4-Level) Energy Diagrams + Resonator</text>

  <!-- LEFT: RUBY LASER 3-LEVEL -->
  <rect x="20" y="45" width="430" height="375" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="235" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#991b1b">(a) Ruby Laser (3-Level Solid State — Cr³⁺ in Al₂O₃)</text>

  <!-- Energy levels -->
  <!-- E3 Pump Bands -->
  <rect x="75" y="98" width="210" height="28" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#14532d">E₃ Pump Bands (⁴F₁ Blue, ⁴F₂ Green)</text>

  <!-- E2 Metastable State -->
  <line x1="165" y1="210" x2="355" y2="210" stroke="#7c3aed" stroke-width="3"/>
  <text x="362" y="214" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">E₂ Metastable (²E)</text>
  <text x="362" y="228" font-family="Arial, sans-serif" font-size="9.5" fill="#5b21b6">τ ≈ 3 ms</text>

  <!-- E1 Ground State -->
  <line x1="65" y1="345" x2="355" y2="345" stroke="#0f172a" stroke-width="3"/>
  <text x="362" y="349" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">E₁ Ground (⁴A₂)</text>

  <!-- Optical Pump arrows Up -->
  <line x1="115" y1="342" x2="115" y2="132" stroke="#16a34a" stroke-width="2.2"/>
  <polygon points="115,126 110,136 120,136" fill="#16a34a"/>
  <text x="72" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#15803d">Optical Pump</text>
  <text x="72" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#15803d">(Xe Flash 550 nm)</text>

  <!-- Non-radiative decay E3 -> E2 -->
  <path d="M 195 126 Q 210 150 198 168 Q 186 185 202 204" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="203,208 197,200 207,199" fill="#64748b"/>
  <text x="260" y="168" font-family="Arial, sans-serif" font-size="9.5" fill="#475569">Fast Non-Radiative</text>
  <text x="260" y="180" font-family="Arial, sans-serif" font-size="9.5" fill="#475569">Decay (10⁻¹¹ s)</text>

  <!-- Laser transition E2 -> E1 -->
  <line x1="255" y1="213" x2="255" y2="338" stroke="#dc2626" stroke-width="2.8"/>
  <polygon points="255,343 249,332 261,332" fill="#dc2626"/>
  <text x="264" y="274" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#dc2626">Laser Output</text>
  <text x="264" y="290" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">λ = 694.3 nm</text>
  <text x="264" y="305" font-family="Arial, sans-serif" font-size="9.5" fill="#991b1b">(Pulsed Red)</text>

  <!-- Resonator note -->
  <rect x="40" y="365" width="390" height="42" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="235" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">High threshold: requires pumping &gt;50% of Cr³⁺ out of ground state E₁.</text>
  <text x="235" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">Resonator: 100% silvered back face + ~90% partially reflecting front face.</text>

  <!-- RIGHT: He-Ne LASER 4-LEVEL -->
  <rect x="470" y="45" width="430" height="375" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="685" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a8a">(b) He-Ne Laser (4-Level Gas — 10:1 Mixture)</text>

  <!-- Ground state across both -->
  <line x1="490" y1="345" x2="880" y2="345" stroke="#0f172a" stroke-width="3"/>
  <text x="535" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">He Ground</text>
  <text x="765" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">Ne Ground (E₁)</text>

  <!-- He levels -->
  <line x1="495" y1="120" x2="600" y2="120" stroke="#0284c7" stroke-width="2.8"/>
  <text x="548" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">He 2¹S₀ (20.61 eV)</text>
  <line x1="495" y1="155" x2="600" y2="155" stroke="#0284c7" stroke-width="2.5"/>
  <text x="548" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">He 2³S₁ (19.82 eV)</text>

  <!-- Electric discharge pump on He -->
  <line x1="535" y1="342" x2="535" y2="127" stroke="#0284c7" stroke-width="2.2"/>
  <polygon points="535,122 530,132 540,132" fill="#0284c7"/>
  <text x="506" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0369a1" transform="rotate(-90 506 245)">e⁻ Discharge Collisions</text>

  <!-- Ne levels -->
  <line x1="690" y1="122" x2="860" y2="122" stroke="#7c3aed" stroke-width="2.8"/>
  <text x="790" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5b21b6">Ne 3s (20.66 eV) — Upper (E₄)</text>
  <line x1="690" y1="158" x2="860" y2="158" stroke="#7c3aed" stroke-width="2"/>
  <text x="790" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#5b21b6">Ne 2s (19.78 eV)</text>

  <line x1="690" y1="230" x2="860" y2="230" stroke="#0f172a" stroke-width="2.2"/>
  <text x="805" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#334155">Ne 2p (18.70 eV) — Lower (E₃)</text>

  <line x1="690" y1="295" x2="860" y2="295" stroke="#0f172a" stroke-width="2"/>
  <text x="805" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#475569">Ne 1s (E₂ Metastable)</text>

  <!-- Resonant energy transfer He* -> Ne -->
  <line x1="603" y1="121" x2="684" y2="121" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="688,121 679,116 679,126" fill="#d97706"/>
  <line x1="603" y1="156" x2="684" y2="156" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="688,156 679,151 679,161" fill="#d97706"/>
  <text x="645" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#b45309">Resonant</text>
  <text x="645" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#b45309">Transfer</text>

  <!-- 632.8 nm Lasing Arrow Ne 3s -> 2p -->
  <line x1="725" y1="124" x2="725" y2="223" stroke="#dc2626" stroke-width="3"/>
  <polygon points="725,228 719,218 731,218" fill="#dc2626"/>
  <text x="734" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">632.8 nm (CW Red)</text>

  <!-- Fast decay 2p -> 1s -> wall collision -->
  <line x1="725" y1="232" x2="725" y2="288" stroke="#64748b" stroke-width="2"/>
  <polygon points="725,293 720,284 730,284" fill="#64748b"/>
  <text x="734" y="264" font-family="Arial, sans-serif" font-size="9.5" fill="#475569">Spontaneous (~600 nm)</text>

  <line x1="725" y1="297" x2="725" y2="338" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3,2"/>
  <polygon points="725,343 720,334 730,334" fill="#64748b"/>
  <text x="734" y="324" font-family="Arial, sans-serif" font-size="9" fill="#475569">Wall de-excitation</text>

  <rect x="490" y="368" width="390" height="40" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="685" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a">Continuous Wave (CW), superior monochromaticity, low threshold power!</text>
  <text x="685" y="399" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#1e40af">Other transitions: 3s → 3p (3.39 μm IR), 2s → 2p (1.15 μm IR).</text>
</svg>