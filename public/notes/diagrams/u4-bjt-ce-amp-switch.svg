<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Inter, system-ui, sans-serif">
  <rect width="920" height="480" rx="14" fill="#fcfaf3" stroke="#2b2a28" stroke-width="2"/>
  <text x="460" y="32" text-anchor="middle" fill="#2b2a28" font-size="18" font-weight="700">BEEE High-Yield: BJT (NPN vs PNP), CE Amplifier &amp; Switch</text>

  <!-- Panel 1: NPN vs PNP Symbols & Currents -->
  <rect x="20" y="50" width="280" height="410" rx="10" fill="#efe7d2" stroke="#2b2a28"/>
  <text x="160" y="74" text-anchor="middle" fill="#1e6e67" font-size="14" font-weight="700">1. NPN vs PNP BJT</text>

  <!-- NPN -->
  <text x="160" y="100" text-anchor="middle" fill="#13534d" font-size="12" font-weight="700">NPN ("Not Pointing iN")</text>
  <circle cx="160" cy="155" r="36" fill="none" stroke="#555046" stroke-width="1.5"/>
  <line x1="145" y1="133" x2="145" y2="177" stroke="#2b2a28" stroke-width="3.5"/>
  <line x1="100" y1="155" x2="145" y2="155" stroke="#1e6e67" stroke-width="2"/>
  <line x1="145" y1="142" x2="180" y2="118" stroke="#13534d" stroke-width="2"/>
  <line x1="145" y1="168" x2="180" y2="192" stroke="#9e3512" stroke-width="2"/>
  <polygon points="178,191 167,188 173,179" fill="#9e3512"/>
  <text x="90" y="159" fill="#1e6e67" font-size="11" font-weight="700">B</text>
  <text x="186" y="122" fill="#13534d" font-size="11" font-weight="700">C (Ic↓)</text>
  <text x="186" y="195" fill="#9e3512" font-size="11" font-weight="700">E (Ie↓)</text>
  <text x="160" y="218" text-anchor="middle" fill="#2b2a28" font-size="10">IB→, IC↓ enter | IE↓ leaves</text>

  <!-- PNP -->
  <text x="160" y="254" text-anchor="middle" fill="#9e3512" font-size="12" font-weight="700">PNP ("Pointing iN Proudly")</text>
  <circle cx="160" cy="310" r="36" fill="none" stroke="#555046" stroke-width="1.5"/>
  <line x1="145" y1="288" x2="145" y2="332" stroke="#2b2a28" stroke-width="3.5"/>
  <line x1="100" y1="310" x2="145" y2="310" stroke="#1e6e67" stroke-width="2"/>
  <line x1="145" y1="297" x2="180" y2="273" stroke="#9e3512" stroke-width="2"/>
  <line x1="145" y1="323" x2="180" y2="347" stroke="#13534d" stroke-width="2"/>
  <polygon points="148,295 159,298 153,287" fill="#9e3512"/>
  <text x="90" y="314" fill="#1e6e67" font-size="11" font-weight="700">B</text>
  <text x="186" y="277" fill="#9e3512" font-size="11" font-weight="700">E (Ie↓)</text>
  <text x="186" y="351" fill="#13534d" font-size="11" font-weight="700">C (Ic↓)</text>

  <!-- BJT equations -->
  <rect x="35" y="375" width="250" height="72" rx="6" fill="#f6f0e1" stroke="#555046"/>
  <text x="160" y="395" text-anchor="middle" fill="#8f6200" font-size="11" font-weight="700">IE = IB + IC | IC = β·IB = α·IE</text>
  <text x="160" y="415" text-anchor="middle" fill="#2b2a28" font-size="11">β = α / (1 - α), α = β / (β + 1)</text>
  <text x="160" y="435" text-anchor="middle" fill="#1e6e67" font-size="10">Active: B-E Forward, C-B Reverse</text>

  <!-- Panel 2: Fixed-Bias CE Amplifier -->
  <rect x="315" y="50" width="300" height="410" rx="10" fill="#efe7d2" stroke="#2b2a28"/>
  <text x="465" y="74" text-anchor="middle" fill="#13534d" font-size="14" font-weight="700">2. CE Amplifier (Fixed Bias)</text>
  <!-- +Vcc rail -->
  <line x1="365" y1="100" x2="565" y2="100" stroke="#9e3512" stroke-width="2.5"/>
  <text x="465" y="94" text-anchor="middle" fill="#9e3512" font-size="11" font-weight="700">+Vcc</text>
  <!-- RB -->
  <line x1="410" y1="100" x2="410" y2="135" stroke="#555046" stroke-width="2"/>
  <rect x="400" y="135" width="20" height="45" fill="#e6dcc3" stroke="#1e6e67" stroke-width="1.5"/>
  <text x="383" y="162" fill="#1e6e67" font-size="11" font-weight="700">RB</text>
  <line x1="410" y1="180" x2="410" y2="275" stroke="#555046" stroke-width="2"/>
  <!-- RC -->
  <line x1="510" y1="100" x2="510" y2="135" stroke="#555046" stroke-width="2"/>
  <rect x="500" y="135" width="20" height="45" fill="#e6dcc3" stroke="#13534d" stroke-width="1.5"/>
  <text x="526" y="162" fill="#13534d" font-size="11" font-weight="700">RC</text>
  <line x1="510" y1="180" x2="510" y2="250" stroke="#555046" stroke-width="2"/>
  <!-- Coupling Caps C1, C2 -->
  <line x1="340" y1="275" x2="372" y2="275" stroke="#9e3512" stroke-width="2"/>
  <line x1="372" y1="263" x2="372" y2="287" stroke="#9e3512" stroke-width="2.5"/>
  <line x1="380" y1="263" x2="380" y2="287" stroke="#9e3512" stroke-width="2.5"/>
  <line x1="380" y1="275" x2="475" y2="275" stroke="#9e3512" stroke-width="2"/>
  <text x="342" y="264" fill="#8f6200" font-size="10">Vin~</text>
  <text x="370" y="302" fill="#9e3512" font-size="10">C1</text>

  <line x1="510" y1="220" x2="550" y2="220" stroke="#9e3512" stroke-width="2"/>
  <line x1="550" y1="208" x2="550" y2="232" stroke="#9e3512" stroke-width="2.5"/>
  <line x1="558" y1="208" x2="558" y2="232" stroke="#9e3512" stroke-width="2.5"/>
  <line x1="558" y1="220" x2="592" y2="220" stroke="#9e3512" stroke-width="2"/>
  <text x="568" y="210" fill="#8f6200" font-size="10">Vout~</text>
  <text x="550" y="246" fill="#9e3512" font-size="10">C2</text>

  <!-- NPN in CE -->
  <circle cx="490" cy="275" r="24" fill="none" stroke="#555046" stroke-width="1.5"/>
  <line x1="478" y1="258" x2="478" y2="292" stroke="#2b2a28" stroke-width="3"/>
  <line x1="478" y1="266" x2="510" y2="250" stroke="#13534d" stroke-width="2"/>
  <line x1="478" y1="284" x2="510" y2="302" stroke="#9e3512" stroke-width="2"/>
  <line x1="510" y1="302" x2="510" y2="340" stroke="#555046" stroke-width="2"/>
  <!-- Ground -->
  <line x1="496" y1="340" x2="524" y2="340" stroke="#2b2a28" stroke-width="2"/>
  <line x1="502" y1="346" x2="518" y2="346" stroke="#2b2a28" stroke-width="2"/>
  <line x1="507" y1="352" x2="513" y2="352" stroke="#2b2a28" stroke-width="2"/>

  <!-- DC Equations -->
  <rect x="330" y="370" width="270" height="77" rx="6" fill="#f6f0e1" stroke="#555046"/>
  <text x="465" y="390" text-anchor="middle" fill="#1e6e67" font-size="11" font-weight="700">IB = (Vcc - VBE) / RB</text>
  <text x="465" y="410" text-anchor="middle" fill="#13534d" font-size="11" font-weight="700">IC = β·IB | VCE = Vcc - IC·RC</text>
  <text x="465" y="430" text-anchor="middle" fill="#8f6200" font-size="10">180° phase shift between Vin &amp; Vout</text>

  <!-- Panel 3: BJT as Switch & Load Line -->
  <rect x="630" y="50" width="270" height="410" rx="10" fill="#efe7d2" stroke="#2b2a28"/>
  <text x="765" y="74" text-anchor="middle" fill="#9e3512" font-size="14" font-weight="700">3. Regions &amp; Switch Action</text>

  <!-- Output Load Line Graph -->
  <line x1="665" y1="265" x2="875" y2="265" stroke="#555046" stroke-width="1.5"/>
  <line x1="665" y1="115" x2="665" y2="265" stroke="#555046" stroke-width="1.5"/>
  <!-- Load line -->
  <line x1="665" y1="135" x2="855" y2="265" stroke="#1e6e67" stroke-width="2.5"/>
  <!-- Saturation and Cutoff -->
  <circle cx="668" cy="137" r="5" fill="#13534d"/>
  <text x="678" y="135" fill="#13534d" font-size="10" font-weight="700">SATURATION (ON)</text>
  <text x="678" y="148" fill="#2b2a28" font-size="9">VCE ≈ 0.2V, IC = Vcc/RC</text>

  <circle cx="760" cy="200" r="5" fill="#8f6200"/>
  <text x="770" y="198" fill="#8f6200" font-size="10" font-weight="700">Q-Point (Active)</text>

  <circle cx="855" cy="265" r="5" fill="#9e3512"/>
  <text x="760" y="256" fill="#9e3512" font-size="10" font-weight="700">CUT-OFF (OFF)</text>
  <text x="670" y="282" fill="#2b2a28" font-size="10">0</text>
  <text x="840" y="282" fill="#2b2a28" font-size="10">Vcc</text>
  <text x="765" y="282" text-anchor="middle" fill="#555046" font-size="10">VCE →</text>
  <text x="646" y="130" fill="#555046" font-size="10">IC</text>

  <!-- Switch Design Box -->
  <rect x="645" y="305" width="240" height="142" rx="6" fill="#f6f0e1" stroke="#555046"/>
  <text x="765" y="328" text-anchor="middle" fill="#2b2a28" font-size="12" font-weight="700">BJT Switch Design Rules:</text>
  <text x="658" y="352" fill="#9e3512" font-size="11">• OFF (Cut-off): Vin = 0V → IB = 0</text>
  <text x="668" y="368" fill="#2b2a28" font-size="10">Both junctions reverse → VCE ≈ Vcc</text>
  <text x="658" y="392" fill="#13534d" font-size="11">• ON (Saturation): IB &gt; IC(sat) / β</text>
  <text x="668" y="408" fill="#2b2a28" font-size="10">Use overdrive factor (e.g. 2× IB_min)</text>
  <text x="658" y="432" fill="#8f6200" font-size="11">• RB = (Vin - VBE) / IB(drive)</text>
</svg>
