<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="920" height="520" rx="14" fill="#0f172a"/>
  <text x="460" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">BEEE High-Yield: P-N Junction, Rectifiers &amp; Zener Voltage Regulator</text>

  <!-- Panel 1: P-N Junction Biasing -->
  <rect x="20" y="50" width="430" height="215" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="235" y="72" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">1. P-N Junction Construction &amp; V-I Curve</text>
  <!-- Junction bar -->
  <rect x="42" y="88" width="95" height="52" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="137" y="88" width="36" height="52" fill="#475569" fill-opacity="0.6" stroke="#94a3b8" stroke-dasharray="3,2"/>
  <rect x="173" y="88" width="95" height="52" fill="#ef4444" fill-opacity="0.25" stroke="#f87171" stroke-width="1.5"/>
  <text x="89" y="110" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">P-Type (h+)</text>
  <text x="89" y="128" text-anchor="middle" fill="#cbd5e1" font-size="10">- - Acceptor ions</text>
  <text x="155" y="112" text-anchor="middle" fill="#fde047" font-size="10" font-weight="700">Depl.</text>
  <text x="155" y="126" text-anchor="middle" fill="#fde047" font-size="10">Layer</text>
  <text x="220" y="110" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">N-Type (e-)</text>
  <text x="220" y="128" text-anchor="middle" fill="#cbd5e1" font-size="10">+ + Donor ions</text>
  <text x="155" y="156" text-anchor="middle" fill="#e2e8f0" font-size="11">Si barrier Vγ ≈ 0.7 V | Ge ≈ 0.3 V</text>
  <text x="45" y="178" fill="#4ade80" font-size="11">• Forward Bias (+ to P): barrier shrinks → mA</text>
  <text x="45" y="196" fill="#fb923c" font-size="11">• Reverse Bias (+ to N): barrier widens → μA</text>
  <!-- Mini V-I Axes -->
  <line x1="305" y1="175" x2="430" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="370" y1="90" x2="370" y2="248" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 370 175 L 395 173 Q 408 168 416 98" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <path d="M 370 175 L 325 178 L 322 242" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="405" y="188" fill="#4ade80" font-size="10">0.7V</text>
  <text x="315" y="215" fill="#f43f5e" font-size="10">-Vz</text>
  <text x="380" y="102" fill="#cbd5e1" font-size="10">+I (mA)</text>

  <!-- Panel 2: Half-Wave vs Bridge Full-Wave Rectifier -->
  <rect x="470" y="50" width="430" height="215" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="685" y="72" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700">2. Full-Wave Bridge Rectifier + C-Filter</text>
  <!-- AC input coils -->
  <circle cx="515" cy="145" r="18" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 505 145 Q 510 135 515 145 T 525 145" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="515" y="176" text-anchor="middle" fill="#cbd5e1" font-size="10">Vs(rms)</text>
  <!-- Bridge Diamond -->
  <polygon points="620,95 675,145 620,195 565,145" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="533" y1="145" x2="565" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="675" y1="145" x2="705" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Top and bottom rails -->
  <line x1="620" y1="95" x2="865" y2="95" stroke="#4ade80" stroke-width="2"/>
  <line x1="620" y1="195" x2="865" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="620" cy="95" r="3.5" fill="#4ade80"/>
  <circle cx="620" cy="195" r="3.5" fill="#94a3b8"/>
  <!-- Labels D1-D4 -->
  <text x="580" y="114" fill="#fde047" font-size="10" font-weight="700">D4</text>
  <text x="648" y="114" fill="#4ade80" font-size="10" font-weight="700">D1</text>
  <text x="580" y="182" fill="#4ade80" font-size="10" font-weight="700">D2</text>
  <text x="648" y="182" fill="#fde047" font-size="10" font-weight="700">D3</text>
  <!-- Capacitor filter -->
  <line x1="745" y1="95" x2="745" y2="138" stroke="#38bdf8" stroke-width="2"/>
  <line x1="731" y1="138" x2="759" y2="138" stroke="#38bdf8" stroke-width="3"/>
  <line x1="731" y1="148" x2="759" y2="148" stroke="#38bdf8" stroke-width="3"/>
  <line x1="745" y1="148" x2="745" y2="195" stroke="#38bdf8" stroke-width="2"/>
  <text x="723" y="147" fill="#38bdf8" font-size="11" font-weight="700">C</text>
  <!-- Load RL -->
  <line x1="825" y1="95" x2="825" y2="122" stroke="#f8fafc" stroke-width="2"/>
  <rect x="815" y="122" width="20" height="46" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="825" y1="168" x2="825" y2="195" stroke="#f8fafc" stroke-width="2"/>
  <text x="853" y="150" fill="#e2e8f0" font-size="11" font-weight="700">RL</text>
  <text x="865" y="88" fill="#4ade80" font-size="10">+Vdc</text>
  <text x="685" y="220" text-anchor="middle" fill="#e2e8f0" font-size="11">HWR: Vdc = Vm/π, η = 40.6%, γ = 1.21</text>
  <text x="685" y="238" text-anchor="middle" fill="#fde047" font-size="11">FWR: Vdc = 2Vm/π, η = 81.2%, γ = 0.482, f_rip = 2f</text>
  <text x="685" y="255" text-anchor="middle" fill="#93c5fd" font-size="10">C-Filter FWR ripple factor: γ = 1 / (4√3 · f · C · RL)</text>

  <!-- Panel 3: Zener Voltage Regulator -->
  <rect x="20" y="280" width="880" height="220" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="460" y="304" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">3. Zener Diode Shunt Voltage Regulator (Reverse Breakdown Region)</text>
  <!-- DC Unregulated input -->
  <circle cx="85" cy="395" r="24" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="391" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">Vin</text>
  <text x="85" y="406" text-anchor="middle" fill="#94a3b8" font-size="9">(&gt; Vz)</text>
  <line x1="85" y1="335" x2="85" y2="371" stroke="#94a3b8" stroke-width="2"/>
  <line x1="85" y1="419" x2="85" y2="455" stroke="#94a3b8" stroke-width="2"/>
  <!-- Top rail + Rs -->
  <line x1="85" y1="335" x2="175" y2="335" stroke="#4ade80" stroke-width="2"/>
  <rect x="175" y="325" width="75" height="20" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <text x="212" y="318" text-anchor="middle" fill="#fde047" font-size="11" font-weight="700">Rs (Series)</text>
  <line x1="250" y1="335" x2="475" y2="335" stroke="#4ade80" stroke-width="2"/>
  <line x1="85" y1="455" x2="475" y2="455" stroke="#94a3b8" stroke-width="2"/>
  <!-- Current arrow Is -->
  <text x="295" y="327" fill="#4ade80" font-size="11">Is = (Vin - Vz) / Rs →</text>
  <!-- Zener diode shunt (pointing up = reverse bias) -->
  <line x1="340" y1="335" x2="340" y2="380" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="340,382 325,408 355,408" fill="#a78bfa"/>
  <polyline points="322,376 327,382 353,382 358,388" fill="none" stroke="#fde047" stroke-width="2.5"/>
  <line x1="340" y1="408" x2="340" y2="455" stroke="#a78bfa" stroke-width="2"/>
  <text x="366" y="395" fill="#c4b5fd" font-size="11" font-weight="700">Zener (Vz)</text>
  <text x="366" y="410" fill="#cbd5e1" font-size="10">↓ Iz = Is - IL</text>
  <!-- Load RL -->
  <line x1="475" y1="335" x2="475" y2="365" stroke="#f8fafc" stroke-width="2"/>
  <rect x="463" y="365" width="24" height="60" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <line x1="475" y1="425" x2="475" y2="455" stroke="#f8fafc" stroke-width="2"/>
  <text x="500" y="398" fill="#38bdf8" font-size="11" font-weight="700">RL</text>
  <text x="500" y="414" fill="#cbd5e1" font-size="10">↓ IL = Vz/RL</text>

  <!-- Regulator Formulas Box -->
  <rect x="555" y="322" width="325" height="162" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="572" y="346" fill="#f8fafc" font-size="12" font-weight="700">Key Design Equations:</text>
  <text x="572" y="368" fill="#4ade80" font-size="11">1. Vout = Vz (constant while Iz ≥ Iz_min)</text>
  <text x="572" y="388" fill="#fde047" font-size="11">2. Is = Iz + IL = (Vin - Vz) / Rs</text>
  <text x="572" y="408" fill="#38bdf8" font-size="11">3. Max Rs = (Vin_min - Vz) / (Iz_min + IL_max)</text>
  <text x="572" y="428" fill="#fb923c" font-size="11">4. Max Zener Power: Pz_max = Vz · Iz_max</text>
  <text x="572" y="448" fill="#cbd5e1" font-size="10">(Worst-case Iz occurs at no-load IL=0 or Vin_max)</text>
  <text x="572" y="470" fill="#c4b5fd" font-size="10">Zener (&lt;6V): strong E-field | Avalanche (&gt;6V): collision</text>
</svg>
