<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430">
  <rect width="920" height="430" rx="12" fill="#fcfaf3" stroke="#2b2a28" stroke-width="2"/>
  <text x="460" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2b2a28">Unit 1 DC Circuits: Source Transformation, Mesh/Nodal Circuit &amp; Star–Delta</text>

  <!-- PANEL 1: SOURCE TRANSFORMATION -->
  <rect x="20" y="45" width="275" height="365" rx="8" fill="#efe7d2" stroke="#555046"/>
  <text x="157" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(a) Source Transformation</text>
  <!-- Voltage source + series R -->
  <circle cx="80" cy="145" r="20" fill="#e6dcc3" stroke="#b8810b" stroke-width="2"/>
  <text x="80" y="142" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold">+</text>
  <text x="80" y="158" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold">−</text>
  <text x="46" y="150" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8f6200">V_s</text>
  <polyline points="80,125 80,100 120,100 125,92 135,108 145,92 155,108 165,100 220,100" fill="none" stroke="#2b2a28" stroke-width="2"/>
  <text x="145" y="86" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9e3512">R_s</text>
  <line x1="80" y1="165" x2="80" y2="185" stroke="#2b2a28" stroke-width="2"/>
  <line x1="80" y1="185" x2="220" y2="185" stroke="#2b2a28" stroke-width="2"/>
  <circle cx="222" cy="100" r="4" fill="#fcfaf3" stroke="#2b2a28" stroke-width="1.5"/>
  <circle cx="222" cy="185" r="4" fill="#fcfaf3" stroke="#2b2a28" stroke-width="1.5"/>
  <text x="234" y="104" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold">A</text>
  <text x="234" y="189" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold">B</text>

  <text x="157" y="218" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#13534d">⇅  I_s = V_s / R_s  |  V_s = I_s R_s  ⇅</text>

  <!-- Current source || R_p -->
  <circle cx="80" cy="290" r="20" fill="#e6dcc3" stroke="#1e6e67" stroke-width="2"/>
  <line x1="80" y1="302" x2="80" y2="278" stroke="#1e6e67" stroke-width="2"/>
  <polygon points="80,275 75,283 85,283" fill="#1e6e67"/>
  <text x="45" y="294" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e6e67">I_s</text>
  <line x1="80" y1="270" x2="80" y2="245" stroke="#2b2a28" stroke-width="2"/>
  <line x1="80" y1="245" x2="220" y2="245" stroke="#2b2a28" stroke-width="2"/>
  <line x1="80" y1="310" x2="80" y2="335" stroke="#2b2a28" stroke-width="2"/>
  <line x1="80" y1="335" x2="220" y2="335" stroke="#2b2a28" stroke-width="2"/>
  <polyline points="150,245 150,265 142,270 158,280 142,290 158,300 150,305 150,335" fill="none" stroke="#9e3512" stroke-width="2"/>
  <text x="172" y="293" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9e3512">R_s</text>
  <circle cx="222" cy="245" r="4" fill="#fcfaf3" stroke="#2b2a28" stroke-width="1.5"/>
  <circle cx="222" cy="335" r="4" fill="#fcfaf3" stroke="#2b2a28" stroke-width="1.5"/>

  <rect x="34" y="352" width="247" height="44" rx="5" fill="#f6f0e1" stroke="#555046"/>
  <text x="157" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e6e67">Voltage Divider: V₁ = V · R₁/(R₁ + R₂)</text>
  <text x="157" y="386" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9e3512">Current Divider: I₁ = I · R₂/(R₁ + R₂)</text>

  <!-- PANEL 2: MESH / NODAL EXAM CIRCUIT -->
  <rect x="305" y="45" width="315" height="365" rx="8" fill="#efe7d2" stroke="#555046"/>
  <text x="462" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(b) Mesh &amp; Nodal Two-Loop Circuit</text>

  <!-- Outer loop wires -->
  <line x1="340" y1="125" x2="585" y2="125" stroke="#2b2a28" stroke-width="2"/>
  <line x1="340" y1="265" x2="585" y2="265" stroke="#2b2a28" stroke-width="2"/>
  <!-- Left branch 18V -->
  <line x1="340" y1="125" x2="340" y2="178" stroke="#2b2a28" stroke-width="2"/>
  <line x1="324" y1="178" x2="356" y2="178" stroke="#9e3512" stroke-width="3"/>
  <line x1="331" y1="190" x2="349" y2="190" stroke="#2b2a28" stroke-width="3"/>
  <line x1="340" y1="190" x2="340" y2="265" stroke="#2b2a28" stroke-width="2"/>
  <text x="320" y="168" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">18V</text>

  <!-- Right branch 12V -->
  <line x1="585" y1="125" x2="585" y2="178" stroke="#2b2a28" stroke-width="2"/>
  <line x1="569" y1="178" x2="601" y2="178" stroke="#9e3512" stroke-width="3"/>
  <line x1="576" y1="190" x2="594" y2="190" stroke="#2b2a28" stroke-width="3"/>
  <line x1="585" y1="190" x2="585" y2="265" stroke="#2b2a28" stroke-width="2"/>
  <text x="606" y="168" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">12V</text>

  <!-- Center 6 ohm -->
  <line x1="462" y1="125" x2="462" y2="265" stroke="#2b2a28" stroke-width="2"/>
  <rect x="453" y="165" width="18" height="58" fill="#e6dcc3" stroke="#b8810b" stroke-width="1.8"/>
  <text x="444" y="198" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8f6200">6 Ω</text>

  <!-- Top resistors 1 ohm and 3 ohm -->
  <rect x="378" y="117" width="46" height="16" fill="#e6dcc3" stroke="#1e6e67"/>
  <text x="401" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold">1 Ω</text>
  <rect x="502" y="117" width="46" height="16" fill="#e6dcc3" stroke="#1e6e67"/>
  <text x="525" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold">3 Ω</text>

  <!-- Bottom resistors 2 ohm and 4 ohm -->
  <rect x="378" y="257" width="46" height="16" fill="#e6dcc3" stroke="#1e6e67"/>
  <text x="401" y="290" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold">2 Ω</text>
  <rect x="502" y="257" width="46" height="16" fill="#e6dcc3" stroke="#1e6e67"/>
  <text x="525" y="290" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold">4 Ω</text>

  <!-- Node VA and Mesh I1, I2 -->
  <circle cx="462" cy="125" r="5" fill="#13534d"/>
  <text x="462" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#13534d">Node V_A</text>
  <path d="M 380 190 A 22 22 0 1 1 398 214" fill="none" stroke="#8f6200" stroke-width="2"/>
  <text x="394" y="198" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8f6200">I₁</text>
  <path d="M 505 190 A 22 22 0 1 1 523 214" fill="none" stroke="#8f6200" stroke-width="2"/>
  <text x="519" y="198" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8f6200">I₂</text>

  <rect x="320" y="308" width="285" height="88" rx="5" fill="#f6f0e1" stroke="#555046"/>
  <text x="462" y="328" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e6e67">Nodal (at V_A): (18−V_A)/3 + (12−V_A)/7 = V_A/6</text>
  <text x="462" y="346" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">⇒ V_A = 12.00 V  ⇒  I₆Ω = 12/6 = 2.00 A ↓</text>
  <text x="462" y="366" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#8f6200">Mesh: 9I₁ − 6I₂ = 18  &amp;  −6I₁ + 13I₂ = −12</text>
  <text x="462" y="384" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">⇒ I₁ = 2.00 A, I₂ = 0 A ⇒ I₆Ω = I₁ − I₂ = 2.00 A</text>

  <!-- PANEL 3: STAR-DELTA TRANSFORMATION -->
  <rect x="630" y="45" width="270" height="365" rx="8" fill="#efe7d2" stroke="#555046"/>
  <text x="765" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(c) Star (Y) ↔ Delta (Δ)</text>

  <!-- Triangle Delta -->
  <polygon points="765,105 680,235 850,235" fill="none" stroke="#1e6e67" stroke-width="2.5"/>
  <!-- Inner Star Y -->
  <line x1="765" y1="105" x2="765" y2="190" stroke="#9e3512" stroke-width="2.5"/>
  <line x1="680" y1="235" x2="765" y2="190" stroke="#9e3512" stroke-width="2.5"/>
  <line x1="850" y1="235" x2="765" y2="190" stroke="#9e3512" stroke-width="2.5"/>
  <circle cx="765" cy="190" r="4" fill="#9e3512"/>
  <text x="765" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2b2a28">Node 1</text>
  <text x="670" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2b2a28">Node 2</text>
  <text x="860" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2b2a28">Node 3</text>

  <!-- Labels -->
  <text x="708" y="165" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e6e67">R₁₂</text>
  <text x="822" y="165" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e6e67">R₁₃</text>
  <text x="765" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e6e67">R₂₃</text>
  <text x="774" y="150" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9e3512">R₁</text>
  <text x="720" y="205" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9e3512">R₂</text>
  <text x="808" y="205" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9e3512">R₃</text>

  <rect x="644" y="268" width="242" height="128" rx="5" fill="#f6f0e1" stroke="#555046"/>
  <text x="765" y="287" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#9e3512">Δ → Y (Adjacent Product / Sum):</text>
  <text x="765" y="305" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">R₁ = (R₁₂ · R₁₃) / (R₁₂ + R₂₃ + R₁₃)</text>
  <text x="765" y="329" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e6e67">Y → Δ (Sum of Pairs / Opposite):</text>
  <text x="765" y="347" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">R₁₂ = (R₁R₂ + R₂R₃ + R₃R₁) / R₃</text>
  <text x="765" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#13534d">Balanced Shortcut: R_Δ = 3 · R_Y</text>
</svg>