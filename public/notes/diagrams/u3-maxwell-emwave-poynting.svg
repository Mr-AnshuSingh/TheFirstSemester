<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420">
  <rect width="920" height="420" rx="12" fill="#fcfaf3" stroke="#2b2a28" stroke-width="2"/>
  <text x="460" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2b2a28">Unit 3 Electromagnetism: Displacement Current, Transverse EM Wave &amp; Hysteresis</text>

  <!-- PANEL 1: DISPLACEMENT CURRENT -->
  <rect x="20" y="45" width="275" height="355" rx="8" fill="#efe7d2" stroke="#555046" stroke-width="1.2"/>
  <text x="157" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(a) Ampere-Maxwell Capacitor</text>

  <!-- Wire and capacitor plates -->
  <line x1="40" y1="185" x2="125" y2="185" stroke="#2b2a28" stroke-width="3"/>
  <rect x="125" y="130" width="10" height="110" fill="#555046" stroke="#2b2a28"/>
  <rect x="180" y="130" width="10" height="110" fill="#555046" stroke="#2b2a28"/>
  <line x1="190" y1="185" x2="275" y2="185" stroke="#2b2a28" stroke-width="3"/>

  <!-- Charges on plates -->
  <text x="138" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">+</text>
  <text x="138" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">+</text>
  <text x="138" y="196" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">+</text>
  <text x="138" y="220" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">+</text>
  <text x="168" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e6e67">−</text>
  <text x="168" y="172" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e6e67">−</text>
  <text x="168" y="196" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e6e67">−</text>
  <text x="168" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e6e67">−</text>

  <!-- Electric field E(t) arrows across gap -->
  <line x1="145" y1="158" x2="170" y2="158" stroke="#13534d" stroke-width="2"/>
  <line x1="145" y1="185" x2="170" y2="185" stroke="#13534d" stroke-width="2"/>
  <line x1="145" y1="212" x2="170" y2="212" stroke="#13534d" stroke-width="2"/>

  <!-- Amperian Loop + Balloon Surface S2 -->
  <ellipse cx="82" cy="185" rx="16" ry="42" fill="none" stroke="#8f6200" stroke-width="2"/>
  <path d="M 82 143 Q 160 90 158 185 Q 158 280 82 227" fill="#e6dcc3" fill-opacity="0.25" stroke="#8f6200" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="82" y="128" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#8f6200">Loop C</text>
  <text x="195" y="112" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#8f6200">Balloon S₂</text>
  <text x="58" y="175" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">I_c →</text>
  <text x="157" y="268" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#13534d">Gap: J_d = ∂D/∂t</text>

  <rect x="35" y="290" width="245" height="95" rx="5" fill="#f6f0e1" stroke="#555046"/>
  <text x="157" y="310" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e6e67">I_c (wire) = I_d (gap) = ε₀ dΦ_E/dt</text>
  <text x="157" y="330" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#2b2a28">∇ × H = J_c + ∂D/∂t</text>
  <text x="157" y="350" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#2b2a28">Satisfies ∇·(J_c + J_d) = 0</text>
  <text x="157" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9e3512">Resolves S₁ vs S₂ paradox!</text>

  <!-- PANEL 2: TRANSVERSE EM WAVE + POYNTING VECTOR -->
  <rect x="305" y="45" width="335" height="355" rx="8" fill="#efe7d2" stroke="#555046" stroke-width="1.2"/>
  <text x="472" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(b) Transverse EM Wave (E ⊥ B ⊥ S)</text>

  <!-- Axes: X propagation, Y electric, Z magnetic (diagonal) -->
  <line x1="335" y1="210" x2="620" y2="210" stroke="#2b2a28" stroke-width="2"/>
  <polygon points="625,210 615,205 615,215" fill="#2b2a28"/>
  <text x="615" y="230" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2b2a28">Propagation (x), S = E × H</text>

  <line x1="345" y1="295" x2="345" y2="100" stroke="#9e3512" stroke-width="1.8"/>
  <polygon points="345,94 340,104 350,104" fill="#9e3512"/>
  <text x="352" y="106" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#9e3512">E (y-axis)</text>

  <line x1="315" y1="245" x2="405" y2="145" stroke="#1e6e67" stroke-width="1.8"/>
  <text x="408" y="146" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e6e67">B (z-axis)</text>

  <!-- E wave (vertical sine, red) -->
  <path d="M 345 210 Q 380 115 415 210 T 485 210 T 555 210 T 605 160" fill="none" stroke="#9e3512" stroke-width="2.5"/>
  <!-- E vertical vectors -->
  <line x1="380" y1="210" x2="380" y2="163" stroke="#9e3512" stroke-width="1.4"/>
  <line x1="450" y1="210" x2="450" y2="257" stroke="#9e3512" stroke-width="1.4"/>
  <line x1="520" y1="210" x2="520" y2="163" stroke="#9e3512" stroke-width="1.4"/>

  <!-- B wave (tilted sine, blue) -->
  <path d="M 345 210 Q 395 170 415 210 T 485 210 T 555 210 T 605 190" fill="none" stroke="#1e6e67" stroke-width="2.3" stroke-dasharray="5,2"/>
  <line x1="380" y1="210" x2="395" y2="188" stroke="#1e6e67" stroke-width="1.4"/>
  <line x1="450" y1="210" x2="435" y2="232" stroke="#1e6e67" stroke-width="1.4"/>
  <line x1="520" y1="210" x2="535" y2="188" stroke="#1e6e67" stroke-width="1.4"/>

  <rect x="320" y="305" width="305" height="80" rx="5" fill="#f6f0e1" stroke="#555046"/>
  <text x="472" y="325" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e6e67">Wave speed: c = 1/√(μ₀ε₀) ≈ 3 × 10⁸ m/s</text>
  <text x="472" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">Impedance Z₀ = E/H = √(μ₀/ε₀) ≈ 377 Ω</text>
  <text x="472" y="363" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">Energy flux: ⟨S⟩ = ½ c ε₀ E₀² = E₀²/(2η₀)</text>

  <!-- PANEL 3: MAGNETIC HYSTERESIS -->
  <rect x="650" y="45" width="250" height="355" rx="8" fill="#efe7d2" stroke="#555046" stroke-width="1.2"/>
  <text x="775" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e6e67">(c) Ferromagnetic B–H Loop</text>

  <!-- Axes -->
  <line x1="670" y1="205" x2="880" y2="205" stroke="#2b2a28" stroke-width="1.5"/>
  <line x1="775" y1="95" x2="775" y2="305" stroke="#2b2a28" stroke-width="1.5"/>
  <text x="875" y="198" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2b2a28">H</text>
  <text x="782" y="105" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2b2a28">B</text>

  <!-- Hysteresis Curve -->
  <path d="M 855 118 C 825 118 795 130 775 148 C 745 175 725 205 695 292 C 725 292 755 280 775 262 C 805 235 825 205 855 118 Z" fill="#f6f0e1" fill-opacity="0.6" stroke="#8f6200" stroke-width="2.4"/>
  <!-- Initial magnetization dashed -->
  <path d="M 775 205 Q 815 140 855 118" fill="none" stroke="#13534d" stroke-width="1.8" stroke-dasharray="4,2"/>

  <!-- Markers -->
  <circle cx="775" cy="148" r="4" fill="#9e3512"/>
  <text x="784" y="152" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#9e3512">Retentivity</text>
  <circle cx="728" cy="205" r="4" fill="#1e6e67"/>
  <text x="708" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#1e6e67">−Hc</text>
  <text x="708" y="220" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#1e6e67">(Coercivity)</text>

  <text x="775" y="325" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#2b2a28">Loop Area = Energy Loss/cycle</text>
  <text x="775" y="346" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#13534d">Dia (χ&lt;0) | Para (χ=C/T)</text>
  <text x="775" y="366" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#8f6200">Ferro: χ = C/(T − Tc) above Tc</text>
</svg>